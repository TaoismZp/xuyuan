<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>FIN·TYPE｜金融决策人格实验</title>
<style>
:root{
  --paper:#f4efe6; --paper2:#fffdf8; --ink:#122033; --muted:#6c7480;
  --blue:#315efb; --red:#e44f4f; --green:#1f8b62; --amber:#b77a18;
  --line:#d9d2c6; --soft:#eae4d9; --navy:#0d1a2b; --shadow:0 20px 55px rgba(25,35,50,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
body{overflow-x:hidden}
button{font:inherit}
.app{min-height:100vh}
.shell{width:min(900px,100%);margin:0 auto;padding:0 18px 52px}
.mast{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:21px;font-weight:950;letter-spacing:-.055em}.logo i{font-style:normal;color:var(--blue)}
.mast small{font-size:11px;color:var(--muted)}
.hero{padding:58px 0 38px}.hero-kicker{font-size:12px;color:var(--blue);font-weight:800;margin-bottom:18px}
.hero h1{font-family:Georgia,"Songti SC","STSong",serif;font-weight:600;font-size:clamp(46px,11vw,88px);line-height:.98;letter-spacing:-.06em;margin:0;max-width:780px}
.hero p{font-size:17px;line-height:1.8;color:#4c5664;max-width:650px;margin:24px 0 0}
.promise{display:grid;grid-template-columns:1.2fr .8fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:34px}.promise div{padding:18px 0}.promise div+div{border-left:1px solid var(--line);padding-left:22px}.promise small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.promise b{font-size:17px}
.start{margin-top:22px;border:0;background:var(--ink);color:#fff;padding:17px 20px;width:100%;font-weight:900;cursor:pointer;box-shadow:var(--shadow)}.start:hover{background:#1d2e46}.fine{font-size:11px;line-height:1.65;color:#838891;margin-top:11px}
.play{padding-top:22px}.progress{display:flex;align-items:center;gap:12px;margin-bottom:22px}.progress b{font-size:12px;white-space:nowrap}.track{height:3px;background:#ddd5c8;flex:1;position:relative}.track i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.marketbar{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;border-bottom:1px solid var(--line);border-top:1px solid var(--line);margin-bottom:30px}.marketbar div{padding:13px 10px 12px 0}.marketbar div+div{border-left:1px solid var(--line);padding-left:12px}.marketbar small{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}.marketbar b{font-size:14px}.up{color:var(--green)} .down{color:var(--red)}
.scene{font-size:12px;color:var(--blue);font-weight:900;margin-bottom:9px}.q h2{font-family:Georgia,"Songti SC","STSong",serif;font-weight:600;font-size:clamp(30px,7vw,47px);line-height:1.12;letter-spacing:-.045em;margin:0 0 14px;max-width:790px}.context{font-size:15px;line-height:1.75;color:#56606d;max-width:760px;margin-bottom:24px}
.choices{border-top:1px solid var(--ink)}.choice{width:100%;display:grid;grid-template-columns:42px 1fr 22px;gap:12px;align-items:start;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:18px 2px;cursor:pointer;color:var(--ink)}.choice:hover{background:rgba(49,94,251,.035)}.choice .letter{width:30px;height:30px;border:1px solid #a8a29a;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}.choice b{display:block;font-size:15px;line-height:1.45}.choice p{font-size:12px;line-height:1.55;color:#777d86;margin:5px 0 0}.choice .arrow{font-size:20px;color:#a0a5ac}.choice:focus-visible{outline:3px solid rgba(49,94,251,.28);outline-offset:-3px}.restart{margin-top:22px;border:0;background:none;color:#7b8088;font-size:12px;text-decoration:underline;cursor:pointer}
.reveal{min-height:72vh;display:flex;flex-direction:column;justify-content:center;padding:30px 0}.reveal .eyebrow{font-size:12px;color:var(--muted);margin-bottom:12px}.reveal .move{font-family:Georgia,"Songti SC","STSong",serif;font-size:clamp(58px,15vw,108px);line-height:.9;font-weight:600;letter-spacing:-.065em;margin-bottom:16px}.reveal h3{font-size:23px;line-height:1.35;margin:0 0 10px}.reveal p{color:#5c6571;line-height:1.72;margin:0}.ledger{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:24px 0}.ledger div{padding:14px 10px 13px 0}.ledger div+div{border-left:1px solid var(--line);padding-left:12px}.ledger small{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.ledger b{font-size:15px}.next{border:0;background:var(--blue);color:white;padding:16px 18px;font-weight:900;cursor:pointer;width:100%}.lesson{font-size:12px;color:#7a8088;line-height:1.65;margin:15px 0 0;border-left:2px solid var(--amber);padding-left:12px}
.act{min-height:76vh;display:flex;flex-direction:column;justify-content:center;padding:30px 0}.act .no{font-family:Georgia,serif;color:var(--blue);font-size:18px}.act h2{font-family:Georgia,"Songti SC","STSong",serif;font-weight:600;font-size:clamp(48px,12vw,88px);line-height:.95;letter-spacing:-.055em;margin:12px 0 18px}.act p{font-size:17px;color:#545f6d;line-height:1.75;max-width:620px}.act .line{height:1px;background:var(--ink);margin:24px 0}.act .quote{font-size:14px;font-weight:700}.act button{margin-top:28px}
.result{padding:34px 0 64px}.result-kicker{font-size:12px;color:var(--blue);font-weight:900}.typecode{font-family:Georgia,serif;font-size:clamp(82px,20vw,158px);line-height:.85;letter-spacing:-.075em;margin:20px 0 10px}.typename{font-family:Georgia,"Songti SC","STSong",serif;font-size:34px;margin-bottom:12px}.summary{font-size:17px;line-height:1.75;color:#4f5967;max-width:720px}.result-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:26px 0}.result-grid>div{padding:16px 0}.result-grid>div:nth-child(even){border-left:1px solid var(--line);padding-left:18px}.result-grid small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.result-grid b{font-size:17px}.axes{margin:30px 0 34px}.ax{display:grid;grid-template-columns:72px 1fr 72px;gap:12px;align-items:center;margin:15px 0}.ax span{font-size:12px;color:#5d6570}.ax span:last-child{text-align:right}.axbar{height:10px;background:#ded7cb;position:relative}.axbar .mid{position:absolute;left:50%;top:-3px;width:1px;height:16px;background:#a29b91}.axbar i{position:absolute;top:0;height:10px;background:var(--blue)}.verdict{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:30px 0}.verdict section{border-top:2px solid var(--ink);padding-top:14px}.verdict small{font-size:10px;color:var(--muted)}.verdict h3{font-family:Georgia,"Songti SC","STSong",serif;font-size:24px;line-height:1.25;margin:8px 0}.verdict p{font-size:13px;line-height:1.65;color:#65707c;margin:0}.verdict .danger{border-color:var(--red)}.verdict .danger h3{color:#b63c3c}.verdict .edge{border-color:var(--blue)}.expose{background:var(--navy);color:#fff;padding:22px;margin:28px 0;position:relative}.expose:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}.expose small{color:#aeb9c7;font-size:10px}.expose h3{font-family:Georgia,"Songti SC","STSong",serif;font-size:24px;margin:8px 0}.expose p{color:#cbd3dc;line-height:1.65;font-size:13px;margin:0}.sharebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sharebar button{padding:15px;border:1px solid var(--ink);font-weight:900;cursor:pointer}.sharebar .share{background:var(--ink);color:#fff}.sharebar .again{background:transparent;color:var(--ink)}.disclaimer{font-size:11px;color:#8a8e94;line-height:1.65;margin-top:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;font-size:12px;z-index:50;box-shadow:var(--shadow)}
@media(max-width:620px){.shell{padding:0 14px 40px}.mast{height:58px}.hero{padding:44px 0 28px}.hero p{font-size:15px}.promise{grid-template-columns:1fr 1fr}.promise div{padding:14px 0}.promise div+div{padding-left:14px}.marketbar{grid-template-columns:1.2fr 1fr 1fr}.marketbar div:nth-child(4){display:none}.marketbar div:nth-child(3){border-right:0}.q h2{font-size:32px}.choice{grid-template-columns:38px 1fr 18px;padding:16px 1px}.ledger{grid-template-columns:1fr 1fr}.ledger div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding-left:0}.verdict{grid-template-columns:1fr}.result-grid{grid-template-columns:1fr 1fr}.typecode{font-size:88px}.sharebar{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><div id="app" class="app"></div>
<script>
(()=>{
const app=document.getElementById('app');
const AX={RG:{letters:['R','G'],labels:['留余量','上火力']},FM:{letters:['F','M'],labels:['信因果','信价格']},SI:{letters:['S','I'],labels:['按规则','靠临场']},HT:{letters:['H','T'],labels:['等兑现','做调整']}};
const TYPES={RFSH:['堡垒研究者','你把生存、事实、规则和耐心放在一起。你不容易被行情逼着表态，代价是稀缺机会真正出现时，你有时会慢半拍。'],RFST:['纪律再平衡者','你相信事实，也相信动作应该有边界。你愿意调整，但不愿意把账户交给情绪。'],RFIH:['赔率猎手','你重事实、留余量，却不迷信预设动作。你愿意等，直到现场真的给出赔率。'],RFIT:['证据校准者','你愿意为新证据迅速改动作，同时又不愿把一次判断变成生死局。'],RMSH:['低波趋势者','你尊重市场正在发生什么，也尊重自己的生存边界。你会等结构自己走出来。'],RMST:['风险调度者','你像风险经理一样交易：先看市场，再用规则控制调整速度。你很少被一笔交易绑架。'],RMIH:['市场潜伏者','你愿意等待价格说话，也会保留临场判断。你最擅长的是不在噪音里过度承诺。'],RMIT:['战术防守者','你对市场变化敏感，也愿意快速调仓，但第一目标始终是保住下一次下注权。'],GFSH:['集中价值派','你愿意把资本压在自己真正理解的东西上，并给逻辑足够的兑现时间。'],GFST:['主动估值者','你愿意重仓，但重仓必须有证据和规则。价格一旦越过你设定的边界，你会主动再平衡。'],GFIH:['高确信猎手','当你认为赔率显著偏向自己时，你敢集中，也敢长期拿住；你的强项和危险都来自这份确信。'],GFIT:['逆向突击者','你相信自己的研究，却不迷恋原计划。只要证据改变，你愿意迅速切换火力。'],GMSH:['趋势复利者','你愿意给强趋势更大火力，同时靠规则和等待让利润自己跑。真正危险的是把趋势当成事实本身。'],GMST:['进攻调度者','你愿意把资本快速推向正在发生的机会，用规则管理进攻节奏。效率高，路径风险也高。'],GMIH:['动量捕手','你愿意追随价格和现场，用集中火力捕捉持续性。你最擅长顺风，最怕风向变了还把惯性当信息。'],GMIT:['战术火力手','你最像盘中指挥官：价格、仓位、节奏都可以随时重排。你的优势是快，最大的风险也是快。']};
const qs=[
{act:'I',actName:'行情开始奖励勇敢',pair:['RG','SI'],title:'核心持仓三周涨了 38%，而真正的大催化还没发生。',context:'你原本只打算拿 6% 仓位。现在波动率明显放大，市场开始讨论“这是今年最确定的机会”。',choices:[['把仓位降到 4%，但保留核心头寸','不改变判断，只把未来的错误成本重新压回计划内.',{RG:1,SI:1},-1.2,9,-4],['维持 6%，取消原来的硬阈值，接下来根据盘口和消息临场处理','你保留敞口，也把更多控制权交给现场.',{RG:1,SI:-1},1.0,3,3],['按事先写下的上限加到 9%','你认为价格上涨没有消灭 Edge，只是需要更严格地执行预案.',{RG:-1,SI:1},2.4,-8,7],['加到 9%，但不设固定退出条件，边走边看','你愿意用更大火力换取更大的现场自由度.',{RG:-1,SI:-1},3.0,-9,12]]},
{act:'I',actName:'行情开始奖励勇敢',pair:['FM','HT'],title:'公司业绩很好，但股价高开 7% 后一路回落。',context:'管理层上调全年指引；与此同时，成交量异常放大，盘中从 +7% 回到 +1%。你原先的估值模型仍然成立。',choices:[['继续拿着，让上调后的基本面慢慢兑现','你更愿意相信因果链，而不是一天的价格表情.',{FM:1,HT:1},-.8,0,-2],['保留核心仓，但把一部分切去更便宜的同类资产','你相信基本面，同时愿意主动管理机会成本.',{FM:1,HT:-1},.4,4,3],['先不动，等价格重新站回关键区间再决定','你把价格本身当作需要继续观察的新证据.',{FM:-1,HT:1},-.2,0,-3],['当天减仓，等市场重新给出强势确认再回来','你宁愿牺牲一部分长期逻辑，也不和即时价格结构对抗.',{FM:-1,HT:-1},1.1,8,2]]},
{act:'II',actName:'回撤开始区分信念和惯性',pair:['SI','HT'],title:'你最看好的标的从高点回撤 19%，但没有触发任何你预设的失效条件。',context:'行业指数也在跌。你没有新增信息，只是账户第一次出现明显回撤。',choices:[['完全按原计划不动','没有触发条件，就不制造新动作.',{SI:1,HT:1},-2.2,0,-4],['按计划减一档仓位，给后续加仓留空间','你仍按规则行动，但主动改变未来动作空间.',{SI:1,HT:-1},-1.0,7,-2],['先等两天，重点观察反弹质量和成交结构','你不急着执行旧规则，想让现场多说一点.',{SI:-1,HT:1},.2,0,1],['立即重构仓位：砍掉弱的，保留最强逻辑','你相信此刻最重要的是重新排序，而不是维护原计划.',{SI:-1,HT:-1},1.0,10,4]]},
{act:'II',actName:'回撤开始区分信念和惯性',pair:['RG','FM'],title:'一项你非常熟悉的资产突然被全市场抛售 25%。',context:'你能解释基本面为何没有恶化，但市场的风险溢价正在急剧上升，流动性明显变差。',choices:[['只买一小笔，先确认自己没有漏掉结构性风险','你相信自己的研究，但首先保护下一次加仓权.',{RG:1,FM:1},1.6,-3,-2],['先不接刀，等价格与流动性都稳定再说','你把市场结构当作此刻更重要的证据，也选择保留资本.',{RG:1,FM:-1},.5,0,-5],['按研究结论直接集中加仓','你认为市场恐慌正在给长期价值打折.',{RG:-1,FM:1},4.0,-15,8],['等出现强反转信号后大仓跟进','你愿意上火力，但要让价格先证明抛压正在结束.',{RG:-1,FM:-1},5.1,-14,10]]},
{act:'III',actName:'真正的机会开始和安全感冲突',pair:['RG','HT'],title:'一个你跟踪两年的机会终于出现，但你手上已有三个不错的持仓。',context:'新机会的预期收益明显更高，但要参与就必须降低现有头寸，或者把总仓位推到你过去很少触碰的位置。',choices:[['只腾出少量仓位参与，保留原组合的稳定性','你愿意承认机会，但不让一个新判断重写账户结构.',{RG:1,HT:1},.8,-2,-1],['立刻卖掉最弱的一只，把资金切过去','你控制总风险，但愿意快速把资本重新分配给更高赔率.',{RG:1,HT:-1},1.7,0,2],['不动旧仓，额外提高总仓位参与','你不愿为了等待完美资金结构错过稀缺机会.',{RG:-1,HT:1},3.2,-12,9],['集中调仓，把最强判断变成第一大仓位','你愿意让资本迅速服从当前最优机会.',{RG:-1,HT:-1},4.0,-10,13]]},
{act:'III',actName:'真正的机会开始和安全感冲突',pair:['FM','SI'],title:'你的模型说“便宜”，但价格已经连续六周创新低。',context:'同行没有明显坏消息，财报也没破坏逻辑。唯一不断反驳你的，是价格本身。',choices:[['继续按模型分批买，直到估值或基本面条件改变','你把因果和预设规则放在价格之前.',{FM:1,SI:1},-1.4,-5,3],['模型不变，但暂停加仓；重新访谈和查证后再决定','你仍相信事实，但允许临场重新审视证据链.',{FM:1,SI:-1},-.2,0,-2],['停止买入，等趋势重新转强才恢复计划','你让价格成为规则的一部分.',{FM:-1,SI:1},.6,2,-3],['直接离场，除非市场先证明自己错杀','你把连续价格行为视为足以推翻当前执行的证据.',{FM:-1,SI:-1},1.3,7,0]]},
{act:'IV',actName:'当噪音变成压力',pair:['RG','SI'],title:'你刚连续错了三次，而第四个机会看起来比前三个都好。',context:'账户只回撤 6%，但你的信心明显下降。这个机会和前三笔并不相关。',choices:[['把仓位减半，按原系统继续做','你不因连败改模型，但主动给心理和账户留余量.',{RG:1,SI:1},.6,-3,-5],['小仓先试，盘中根据反馈决定要不要加','你先保留资本，再把判断交给现场.',{RG:1,SI:-1},1.1,-2,-2],['完全按系统原仓位执行','你认为独立机会不该被上一笔结果污染.',{RG:-1,SI:1},2.4,-8,4],['直接重仓，认为连续失手反而提高了这次赔率','你愿意把临场确信转成更大的资本表达.',{RG:-1,SI:-1},-3.2,-14,18]]},
{act:'IV',actName:'当噪音变成压力',pair:['FM','HT'],title:'你持有的公司基本面没变，但整个赛道开始被市场重新定价。',context:'过去两个月，所有同类资产的估值中枢都在下移。没有单一坏消息，只有越来越低的愿意支付价格。',choices:[['继续持有，直到公司自身的长期变量发生变化','你愿意让基本面兑现时间穿越估值收缩.',{FM:1,HT:1},-1.6,0,-2],['保留核心仓，同时逐步换去现金流更确定的同类公司','你仍以因果判断为锚，但主动管理估值风险.',{FM:1,HT:-1},-.4,5,2],['不急着卖，但暂停所有加仓，等待行业定价稳定','你接受价格正在传递信息，却不急于追着市场动作.',{FM:-1,HT:1},.2,0,-3],['迅速降低赛道暴露，等重新获得相对强势再回来','你把市场整体定价看作必须响应的环境变化.',{FM:-1,HT:-1},1.0,10,1]]},
{act:'V',actName:'规则开始遇到例外',pair:['SI','HT'],title:'一条新政策只给你 20 分钟反应，而你的系统从没覆盖过这种情况。',context:'继续按原计划可能错过窗口；临场行动又意味着你要在没有历史样本的情况下改规则。',choices:[['不做，等信息进入既有框架再说','没有规则就不冒充有规则.',{SI:1,HT:1},-.5,0,-6],['按预先设定的“未知事件减风险”原则主动降仓','你用更高层规则处理系统没见过的事件.',{SI:1,HT:-1},.7,6,-3],['先观察最直接的价格反应，不追第一波','你承认系统失语，先让现场提供更多信息.',{SI:-1,HT:1},1.2,0,-1],['立即按你对政策传导的理解调仓','你认为例外本来就需要人的判断来补系统空白.',{SI:-1,HT:-1},2.7,-7,8]]},
{act:'V',actName:'规则开始遇到例外',pair:['RG','FM'],title:'最后一手：你发现自己最赚钱的策略，可能正在被越来越多人复制。',context:'过去一年它依然有效，甚至比以前更稳定；但容量、拥挤和退出流动性都开始变差。',choices:[['降低仓位，继续验证原逻辑是否仍在','你相信过去的因果，但先让错误成本下降.',{RG:1,FM:1},.8,5,-4],['降低仓位，并把价格拥挤度作为主要观察指标','你首先保护资本，同时承认市场结构正在变成核心变量.',{RG:1,FM:-1},1.1,6,-5],['维持火力，只要原始逻辑还没被证伪就继续做','你认为策略变拥挤不等于它已经失效.',{RG:-1,FM:1},2.0,-5,5],['维持甚至提高火力，但一旦价格结构破坏就快速撤退','你愿意继续榨取趋势，只把退出条件交给市场本身.',{RG:-1,FM:-1},2.8,-8,11]]}
];
const acts=[['I','行情开始奖励勇敢','上涨最容易把一次正确，变成一种自我想象。'],['II','回撤开始区分信念和惯性','价格下跌时，你真正相信什么，会比你嘴上说什么更清楚。'],['III','真正的机会开始和安全感冲突','机会成本出现以后，“我都想要”就不再是答案。'],['IV','当噪音变成压力','连续结果会试图接管下一次决定。'],['V','规则开始遇到例外','系统的价值，不在于覆盖所有未来，而在于知道什么时候它已经失语。']];
let s={i:0,axis:{RG:0,FM:0,SI:0,HT:0},nav:1000000,cash:38,stress:16,dd:0,peak:1000000,hist:[],actSeen:null,screen:'intro'};
const fmt=n=>'¥'+Math.round(n).toLocaleString('zh-CN'); const pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%'; const save=()=>localStorage.setItem('fintype_v8',JSON.stringify(s)); const load=()=>{try{let x=JSON.parse(localStorage.getItem('fintype_v8'));if(x&&x.axis&&x.hist)s=x}catch(e){}};
const reset=()=>{localStorage.removeItem('fintype_v8');s={i:0,axis:{RG:0,FM:0,SI:0,HT:0},nav:1000000,cash:38,stress:16,dd:0,peak:1000000,hist:[],actSeen:null,screen:'intro'};render()};
const mast=()=>`<div class="mast"><div class="logo">FIN<i>·</i>TYPE</div><small>金融决策人格实验</small></div>`;
function intro(){app.innerHTML=`<div class="shell">${mast()}<section class="hero"><div class="hero-kicker">不是“你喜欢什么”，而是“代价出现时你怎么选”</div><h1>十次下注，<br>看见你真正的交易人格。</h1><p>每一题都是一个没有标准答案的金融困境。四个选项都说得通，也都要付代价。你只需要选那个<strong>最像你真的会做</strong>的动作。</p><div class="promise"><div><small>决策数量</small><b>10 个真实困境</b></div><div><small>最终结果</small><b>16 种 FIN·TYPE</b></div></div><button class="start" onclick="begin()">进入第一幕</button><div class="fine">结果用于自我观察，不是心理诊断，也不构成投资建议。模拟盈亏只制造路径压力，不参与人格优劣评分。</div></section></div>`}
window.begin=()=>{s.i=0;s.screen='q';s.actSeen=null;save();render()};
function market(){let ret=(s.nav/1000000-1)*100;return `<div class="marketbar"><div><small>模拟账户</small><b>${fmt(s.nav)}</b></div><div><small>本局收益</small><b class="${ret>=0?'up':'down'}">${pct(ret)}</b></div><div><small>现金</small><b>${s.cash}%</b></div><div><small>压力</small><b>${s.stress}/100</b></div></div>`}
function question(){const q=qs[s.i];if(s.actSeen!==q.act){const a=acts.find(x=>x[0]===q.act);s.screen='act';save();app.innerHTML=`<div class="shell">${mast()}<section class="act"><div class="no">ACT ${a[0]}</div><h2>${a[1]}</h2><p>${a[2]}</p><div class="line"></div><div class="quote">这一幕没有正确答案，只有你愿意承担的代价。</div><button class="start" onclick="enterAct('${q.act}')">进入这一幕</button></section></div>`;return}app.innerHTML=`<div class="shell">${mast()}<section class="play"><div class="progress"><b>${String(s.i+1).padStart(2,'0')} / 10</b><div class="track"><i style="width:${(s.i/10)*100}%"></i></div></div>${market()}<div class="scene">ACT ${q.act} · ${q.actName}</div><div class="q"><h2>${q.title}</h2><div class="context">${q.context}</div></div><div class="choices">${q.choices.map((c,j)=>`<button class="choice" onclick="choose(${j})"><span class="letter">${'ABCD'[j]}</span><span><b>${c[0]}</b><p>${c[1]}</p></span><span class="arrow">›</span></button>`).join('')}</div><button class="restart" onclick="resetGame()">重新开始</button></section></div>`}
window.enterAct=(a)=>{s.actSeen=a;s.screen='q';save();render()};
window.choose=(j)=>{const q=qs[s.i],c=q.choices[j],sc=c[2];Object.entries(sc).forEach(([k,v])=>s.axis[k]+=v);const before=s.nav;s.nav=Math.max(200000,s.nav*(1+c[3]/100));s.cash=Math.max(0,Math.min(100,s.cash+c[4]));s.stress=Math.max(0,Math.min(100,s.stress+c[5]));s.peak=Math.max(s.peak,s.nav);s.dd=Math.max(s.dd,(s.peak-s.nav)/s.peak*100);s.hist.push({q:s.i,choice:j,text:c[0],pair:q.pair,score:sc,pnl:c[3],before,after:s.nav});s.screen='reveal';save();render()};
function reveal(){const h=s.hist[s.hist.length-1],move=(h.after/h.before-1)*100;const lesson=['这一次的结果不会证明你的选择是对的。它只会影响你下一手从什么状态开始。','市场最危险的反馈，是让一种偶然赚钱的动作看起来像能力。','真正的人格不是你选了哪一边，而是压力上升后你仍然重复哪种选择。'][h.q%3];app.innerHTML=`<div class="shell">${mast()}<section class="reveal"><div class="eyebrow">AFTER THE BELL · 第 ${h.q+1} 手结算</div><div class="move ${move>=0?'up':'down'}">${pct(move)}</div><h3>${move>=0?'市场暂时奖励了这次动作。':'市场暂时惩罚了这次动作。'}</h3><p>这只是这一条路径的结果，不代表选择本身更高级。FIN·TYPE 记录的是你在不同约束下反复选择了什么。</p><div class="ledger"><div><small>账户净值</small><b>${fmt(s.nav)}</b></div><div><small>现金</small><b>${s.cash}%</b></div><div><small>最大回撤</small><b>${s.dd.toFixed(1)}%</b></div></div><button class="next" onclick="nextQ()">${h.q===9?'揭晓我的 FIN·TYPE':'继续下一手'}</button><div class="lesson">${lesson}</div></section></div>`}
window.nextQ=()=>{if(s.i>=9){s.screen='result'}else{s.i++;s.screen='q'}save();render()};
function typeCode(){return ['RG','FM','SI','HT'].map(k=>s.axis[k]>=0?AX[k].letters[0]:AX[k].letters[1]).join('')}
function axisRow(k){const v=s.axis[k],p=Math.round((v+5)/10*100),width=Math.abs(p-50);return `<div class="ax"><span>${AX[k].labels[0]}</span><div class="axbar"><span class="mid"></span><i style="left:${p<50?p:50}%;width:${width}%"></i></div><span>${AX[k].labels[1]}</span></div>`}
function result(){const code=typeCode(),meta=TYPES[code]||['未命名类型','你的选择形成了一组非常接近边界的决策结构。'];const abs=Object.entries(s.axis).map(([k,v])=>[k,Math.abs(v),v]).sort((a,b)=>b[1]-a[1]);const hard=abs[0],soft=abs[abs.length-1],pressure=s.hist[9];const hardLabel=hard[2]>=0?AX[hard[0]].labels[0]:AX[hard[0]].labels[1];const edge={RG:hard[2]>=0?'你最稳定的优势是给错误留活路。':'你最稳定的优势是敢把资本推向高确信机会。',FM:hard[2]>=0?'你最稳定的优势是把价格背后的因果链拆开看。':'你最稳定的优势是尊重价格和仓位本身传递的信息。',SI:hard[2]>=0?'你最稳定的优势是让规则替你挡住情绪。':'你最稳定的优势是能在规则失语时快速适应。',HT:hard[2]>=0?'你最稳定的优势是让好判断拥有兑现时间。':'你最稳定的优势是愿意主动重排资本，而不是等答案自己出现。'}[hard[0]];const kill={RG:hard[2]>=0?'你可能把“不会死”优化得太好，最后错过真正需要火力的少数机会。':'你最怕的不是看错，而是一次确信把未来的下注权一起押掉。',FM:hard[2]>=0?'你可能在逻辑仍然漂亮时，对市场结构已经换挡反应过慢。':'你可能让价格替代了因果，把拥挤和共识误当成真实。',SI:hard[2]>=0?'规则最容易在环境已经变了的时候，继续给出昨天的正确答案。':'连续几次临场成功，最容易让判断慢慢失去可复盘的边界。',HT:hard[2]>=0?'等待最容易在“核心条件其实已变”时悄悄变成惯性。':'频繁调整最容易把一个本来需要时间的 Edge 切碎。'}[hard[0]];let ret=(s.nav/1000000-1)*100;app.innerHTML=`<div class="shell">${mast()}<section class="result"><div class="result-kicker">YOUR FINANCIAL DECISION TYPE</div><div class="typecode">${code}</div><div class="typename">${meta[0]}</div><div class="summary">${meta[1]}</div><div class="result-grid"><div><small>本局路径收益</small><b class="${ret>=0?'up':'down'}">${pct(ret)}</b></div><div><small>最大回撤</small><b>${s.dd.toFixed(1)}%</b></div><div><small>最硬的一根轴</small><b>${hardLabel}</b></div><div><small>最摇摆的地方</small><b>${soft[0]} 轴</b></div></div><div class="axes">${['RG','FM','SI','HT'].map(axisRow).join('')}</div><div class="verdict"><section class="edge"><small>NATURAL EDGE</small><h3>${edge}</h3><p>这不是“优点认证”，而是你在十次不同约束下最稳定重复的动作倾向。</p></section><section class="danger"><small>KILL ZONE</small><h3>${kill}</h3><p>真正危险的地方，通常是同一个优势被推过头以后出现的反面。</p></section></div><div class="expose"><small>THE MOVE THAT EXPOSED YOU</small><h3>最后一手，你选择了：${pressure.text}</h3><p>最后一题把“策略曾经有效”与“拥挤正在上升”放在一起。它不是最重要的一题，但最容易暴露你在压力下究竟更信什么。</p></div><div class="sharebar"><button class="share" onclick="shareResult()">分享我的 FIN·TYPE</button><button class="again" onclick="resetGame()">再来一局</button></div><div class="disclaimer">FIN·TYPE 是金融决策人格实验，不是经验证的心理测量诊断，也不构成任何投资建议。本局模拟盈亏不参与人格优劣评分。</div></section></div>`}
window.shareResult=async()=>{const code=typeCode(),m=TYPES[code],text=`我的 FIN·TYPE 是 ${code}｜${m[0]}。十个金融困境里，我最稳定的选择暴露了自己的下注方式。你会是哪一种？`;try{if(navigator.share){await navigator.share({title:'FIN·TYPE',text,url:location.href})}else{await navigator.clipboard.writeText(text+' '+location.href);toast('结果已复制')}}catch(e){}};
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
window.resetGame=reset;function render(){if(s.screen==='intro')intro();else if(s.screen==='q'||s.screen==='act')question();else if(s.screen==='reveal')reveal();else result();window.scrollTo(0,0)}load();render();
})();
</script></body></html>
