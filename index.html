<title>FIN·TYPE｜金融决策模拟器</title>
<style>
:root{--ink:#eff7f1;--muted:#9bb1a5;--bg:#06110d;--panel:#0b1c15;--panel2:#10261c;--line:#1d3a2c;--mint:#9df0c5;--amber:#ffcf70;--red:#ff8d88;--blue:#87b8ff;--paper:#e9f4ed;--dark:#07100c;--shadow:0 24px 70px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}body{min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(157,240,197,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(157,240,197,.035) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 62%)}button{font:inherit}.app{min-height:100vh}.wrap{width:min(880px,100%);margin:auto;padding:20px 18px 48px;position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-weight:900;letter-spacing:-.04em;font-size:20px}.brand em{font-style:normal;color:var(--mint)}.version{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.02)}
.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center;padding:36px 0 54px}.hero .tape{font-size:12px;color:var(--mint);letter-spacing:.08em;margin-bottom:18px}.hero h1{margin:0;font-size:clamp(48px,12vw,96px);line-height:.92;letter-spacing:-.075em;font-weight:950;max-width:780px}.hero p{margin:24px 0 0;max-width:640px;color:#c3d3ca;font-size:18px;line-height:1.7}.hero strong{color:white}.ticket{margin-top:34px;border:1px solid #31503f;background:linear-gradient(180deg,#0c1e16,#09160f);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.ticket-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#234032;border:1px solid #234032;border-radius:14px;overflow:hidden}.ticket-cell{background:#0c1a14;padding:13px 14px}.ticket-cell small{display:block;color:#789687;font-size:11px;margin-bottom:5px}.ticket-cell b{font-size:17px}.cta{margin-top:14px;width:100%;border:0;border-radius:14px;background:var(--mint);color:#06110d;padding:16px 18px;font-weight:900;font-size:16px;cursor:pointer}.cta:active{transform:translateY(1px)}.subcta{margin-top:10px;width:100%;border:1px solid var(--line);border-radius:14px;background:transparent;color:#c8d8cf;padding:14px;cursor:pointer}.fine{font-size:11px;line-height:1.55;color:#6f887b;margin-top:11px}
.hud{position:sticky;top:0;z-index:9;padding:10px 0 14px;background:linear-gradient(var(--bg) 70%,transparent)}.hudbox{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(6,17,13,.92);backdrop-filter:blur(14px)}.huditem{padding:11px 12px;border-right:1px solid var(--line)}.huditem:last-child{border-right:0}.huditem small{display:block;color:#728d7f;font-size:10px;margin-bottom:4px}.huditem b{font-size:15px}.pos{color:var(--mint)}.neg{color:var(--red)}
.chapter{padding:14px 0 4px;display:flex;justify-content:space-between;align-items:end;gap:16px}.chapter small{color:var(--mint);font-weight:800}.chapter h2{margin:4px 0 0;font-size:28px;letter-spacing:-.04em}.chapter .round{color:#759080;font-size:12px}.meter{height:5px;background:#10251a;border-radius:999px;overflow:hidden;margin:10px 0 22px}.meter i{display:block;height:100%;background:var(--mint);transition:width .25s ease}
.market{border:1px solid var(--line);background:#0a1912;border-radius:22px;padding:18px 18px 14px;margin-bottom:14px}.market-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.market-head span{font-size:12px;color:#769182}.market-head b{font-size:13px}.spark{height:92px;width:100%;display:block}.spark polyline{fill:none;stroke:var(--mint);stroke-width:3;vector-effect:non-scaling-stroke}.spark .area{fill:url(#g);stroke:none;opacity:.18}.tickerline{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.ticker{white-space:nowrap;color:#94aa9e;font-size:11px;border-right:1px solid #264031;padding-right:10px}.ticker strong{color:#e8f2ec;margin-left:4px}
.prompt{padding:8px 2px 2px}.prompt h3{font-size:clamp(25px,6vw,36px);line-height:1.18;letter-spacing:-.04em;margin:0 0 10px;max-width:790px}.prompt p{margin:0;color:#9cb0a5;line-height:1.65;font-size:14px;max-width:730px}.choices{display:grid;gap:10px;margin:18px 0}.choice{border:1px solid #244434;background:linear-gradient(180deg,#0d2017,#0a1811);border-radius:17px;padding:16px;text-align:left;color:var(--ink);cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start}.choice:hover{border-color:#4b775e}.choice .key{width:30px;height:30px;border:1px solid #315641;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mint);font-weight:900}.choice b{font-size:15px;line-height:1.45;display:block}.choice p{font-size:12px;line-height:1.5;color:#81998c;margin:5px 0 0}.choice .risk{font-size:11px;color:#6f887b;padding-top:4px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.ghost{border:1px solid var(--line);border-radius:12px;background:transparent;color:#aebfb6;padding:10px 12px;cursor:pointer}.ghost[disabled]{opacity:.3;cursor:default}
.settle{min-height:68vh;display:flex;flex-direction:column;justify-content:center}.settle .stamp{font-size:11px;color:#7d9889;margin-bottom:10px}.settle .move{font-size:64px;line-height:1;font-weight:950;letter-spacing:-.06em;margin-bottom:8px}.settle .move.pos{color:var(--mint)}.settle .move.neg{color:var(--red)}.settle h3{font-size:27px;line-height:1.25;margin:8px 0}.settle p{color:#a7b8ae;line-height:1.65;margin:0}.settle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.settle-stat{border-top:1px solid var(--line);padding-top:10px}.settle-stat small{display:block;color:#708b7c;font-size:10px;margin-bottom:4px}.settle-stat b{font-size:16px}.lesson{border-left:3px solid var(--amber);padding:10px 0 10px 14px;color:#d4ddcf;font-size:14px;line-height:1.6;margin:2px 0 18px}
.interlude{min-height:72vh;display:flex;flex-direction:column;justify-content:center}.interlude .roman{font-family:Georgia,serif;font-size:20px;color:#799587}.interlude h2{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:clamp(46px,11vw,84px);line-height:.98;letter-spacing:-.055em;margin:10px 0 18px;max-width:780px}.interlude p{font-size:17px;line-height:1.7;color:#b8c8bf;max-width:650px}.interlude .quote{margin:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;color:#e6eee9;font-size:15px}
.result{padding:24px 0 60px}.result-hero{padding:28px 0 26px;border-bottom:1px solid var(--line)}.result-kicker{font-size:12px;color:#7e9a8a}.code{font-size:clamp(78px,18vw,146px);line-height:.85;font-weight:950;letter-spacing:-.085em;margin:20px 0 12px}.result-name{font-family:Georgia,"Songti SC",serif;font-size:34px}.result-summary{font-size:17px;line-height:1.75;color:#b8c7be;max-width:700px;margin-top:14px}.outcome-band{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.outcome-band div{padding:14px 12px;border-right:1px solid var(--line)}.outcome-band div:last-child{border-right:0}.outcome-band small{display:block;color:#728b7e;font-size:10px;margin-bottom:5px}.outcome-band b{font-size:16px}.axislist{display:grid;gap:15px;margin:26px 0}.axisrow{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}.axisrow span{font-size:12px;color:#8ea397}.axisrow .r{text-align:right}.axistrack{height:4px;background:#183226;border-radius:999px;position:relative}.axistrack:before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:12px;background:#345541}.axistrack i{position:absolute;top:50%;width:13px;height:13px;background:var(--paper);border:3px solid var(--mint);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(157,240,197,.09)}.axisdegree{margin:-8px 74px 0;text-align:center;font-size:11px;color:#d2ded7}.insights{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.insight{border-top:1px solid var(--line);padding:14px 0}.insight small{color:#728c7d;font-size:10px}.insight h4{font-size:18px;margin:7px 0}.insight p{color:#9fb1a7;font-size:13px;line-height:1.6;margin:0}.danger h4{color:#ffaaa5}.counter h4{color:#ffd98d}.signature{border:1px solid #2f5842;border-radius:18px;padding:17px;background:#0a1912;margin:18px 0}.signature small{color:#7d9989}.signature b{display:block;font-size:21px;margin:7px 0}.signature p{margin:0;color:#a7b8ae;line-height:1.6;font-size:13px}.share{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.share button{border-radius:14px;padding:14px;border:1px solid var(--line);cursor:pointer;font-weight:800}.share .primary2{background:var(--paper);color:#07100c;border-color:var(--paper)}.share .secondary{background:transparent;color:#d9e4de}.notice{font-size:11px;color:#6f877a;line-height:1.6;margin-top:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#eaf5ee;color:#07100c;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:800;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.35)}
@media(max-width:600px){.wrap{padding:16px 14px 34px}.hero{min-height:78vh}.hero p{font-size:16px}.ticket-row{grid-template-columns:1fr 1fr}.hudbox{grid-template-columns:1.4fr 1fr 1fr}.huditem:nth-child(4){display:none}.huditem:nth-child(3){border-right:0}.choice{grid-template-columns:32px 1fr}.choice .risk{display:none}.settle-grid{grid-template-columns:1fr 1fr}.settle-grid .settle-stat:last-child{grid-column:1/-1}.outcome-band{grid-template-columns:1fr 1fr}.outcome-band div:nth-child(2){border-right:0}.outcome-band div:nth-child(-n+2){border-bottom:1px solid var(--line)}.axisrow{grid-template-columns:52px 1fr 52px}.axisdegree{margin:-8px 62px 0}.insights,.share{grid-template-columns:1fr}.code{font-size:84px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{const app=document.getElementById('app');const AX={RG:['R','G','保命','火力'],FM:['F','M','事实','市场'],SI:['S','I','系统','临场'],HT:['H','T','等待','调仓']};const TYPE={RFSH:['堡垒研究者','你把生存、事实、系统和耐心放在一起。你不容易被市场拖着走，但真正稀缺的机会来临时，你可能慢半拍。'],RFST:['价值守门员','你相信事实和纪律，也愿意在必要时主动调整。你的强项是低错误率，弱点是容易把“稳妥”当成默认答案。'],RFIH:['耐心猎手','你谨慎，却不是僵硬。你会等赔率，也会读现场。真正的风险是：你可能长期相信自己的现场感比它实际更可靠。'],RFIT:['逆向校准者','你重事实、重生存，但对新信息反应很快。你很难被单一叙事绑架，也容易在噪声里过度优化。'],RMSH:['稳健趋势派','你尊重市场，又给自己留退路。你擅长顺着结构活下来，但容易在“价格就是答案”这件事上让步太多。'],RMST:['风险调度者','你像风险经理一样交易：市场优先、规则优先、主动调仓。优点是韧性，缺点是可能把好机会管理得太干净。'],RMIH:['市场潜伏者','你不急着证明自己，先看价格和现场。你善于等，也善于躲，但容易在真正需要下注时继续观察。'],RMIT:['战术观察者','你最像一个实时战术员：先活下来，再根据价格行动。你的盲点是决策容易越来越依赖最近发生的事。'],GFSH:['高确信复利者','你愿意把研究结论变成仓位，并给它时间兑现。你最危险的时刻，是把“我研究得很深”误当成“我一定对”。'],GFST:['主动价值派','你基于事实下注，也愿意主动重配。你不怕做决定，真正需要防的是频繁把新观点包装成“更好的事实”。'],GFIH:['集中猎手','你敢集中，也敢等待。你可能抓到极大的非对称机会；同样也最容易被一次确信过度伤到。'],GFIT:['机会主义者','你看重事实，但不迷信固定路径。你敢把火力集中在变化最快的地方，代价是系统边界最容易被自己突破。'],GMSH:['趋势复利者','你愿意把市场确认转化成更大下注，并让趋势自己证明。你最怕的是拥挤交易最后一段仍然像“正确”。'],GMST:['进攻调度者','你会主动把资本放到最强的地方。效率很高，路径风险也高；最大敌人不是看错，而是动作太快、仓位太快。'],GMIH:['动量捕手','你相信市场、相信现场、敢下注，也能拿住。你可能是最有爆发力的一型，同时也是最需要防止尾部事故的一型。'],GMIT:['市场掠食者','你把市场当实时博弈场：资金、价格、节奏全都可以利用。你的优势是适应快；你的危险是没有东西能迫使你停手。']};const ACTS=[{n:'I',title:'所有人都开始赚钱',desc:'价格上涨会让很多行为看起来正确。第一幕测的不是胆量，而是你会不会把顺风误读成能力。'},{n:'II',title:'市场第一次反着走',desc:'回撤真正暴露的不是观点，而是你之前留下了多少选择权。'},{n:'III',title:'方向消失，噪声变多',desc:'没有趋势的时候，市场最擅长把无聊伪装成机会。'},{n:'IV',title:'游戏规则换了',desc:'旧规律还在图表里，新规律已经开始决定钱往哪走。'}];const Q=[{a:0,ax:'RG',q:'你的核心持仓三周涨了 34%，群里开始晒三倍收益。',ctx:'你的研究逻辑没变，但波动已经是买入时的两倍。',o:[['继续加到重仓','既然市场正在证明我，就让正确更值钱。',1,{r:9,c:-8,s:10},'顺风时扩大下注，会放大优势，也会缩小未来犯错空间。'],['维持原仓位','不因为价格上涨改变原来的风险预算。',-1,{r:4,c:0,s:-3},'不加码不是看空，而是拒绝让价格替你提高风险预算。'],['先卖一部分','把部分账面收益变成现金，保留继续参与。',-1,{r:2,c:12,s:-7},'落袋会牺牲一部分上行，但买回了选择权。']]},{a:0,ax:'FM',q:'公司业绩大超预期，但开盘高开 8% 后一路回落。',ctx:'新闻很好，价格却像在说“这还不够”。',o:[['看报表继续买','经营事实比一天的价格反应更重要。',1,{r:5,c:-6,s:5},'事实可能最终赢，但价格反应会告诉你：市场原本期待得有多高。'],['先尊重价格','好消息跌，说明预期可能比数据更高。',-1,{r:1,c:2,s:-3},'价格不是答案，但它是关于市场旧预期的一条证据。'],['等一天再说','先让信息和价格都多给一轮信号。',0,{r:0,c:0,s:-5},'延迟行动本身也是一种决策，只要不是为了逃避决策。']]},{a:0,ax:'SI',q:'盘中突然传出监管传闻，价格瞬间跳水。',ctx:'消息未经证实，你的系统没有覆盖这种事件。',o:[['按原规则不动','没有触发预设条件，就不临盘改系统。',1,{r:-3,c:0,s:4},'规则能防止噪声劫持你，也可能让你慢于真实变化。'],['减仓一半','未知事件先降低风险，等事实再恢复。',-1,{r:-1,c:11,s:-4},'临场适应买的是时间，但每次例外都会侵蚀系统边界。'],['直接清仓','先退出，再决定这条消息是真是假。',-1,{r:0,c:20,s:-12},'极端动作能换来确定感，也可能把噪声变成永久决策。']]},{a:1,ax:'HT',q:'指数两周跌 14%，你的核心持仓回撤 23%，逻辑暂时没坏。',ctx:'账户第一次进入明显回撤。',o:[['继续拿','只要核心逻辑没有破，就让时间工作。',1,{r:-6,c:0,s:8},'耐心的前提是“逻辑没坏”真的可验证，而不是一句自我安慰。'],['主动换仓','换到更强、机会成本更低的资产。',-1,{r:2,c:-2,s:-1},'调仓可能提高效率，也会把“等待是否值得”变成另一个预测问题。'],['先降风险','减仓，把账户恢复到能正常思考的位置。',-1,{r:-1,c:14,s:-8},'仓位管理有时不是为了减少亏损，而是为了恢复判断能力。']]},{a:1,ax:'RG',q:'一个新机会可能 5 倍，也可能归零。你估计胜率只有 30%。',ctx:'如果赢，足以改变全年收益；如果输，损失无法追回。',o:[['重仓博非对称','赔率够大，低胜率也值得强下注。',1,{r:16,c:-16,s:16},'赔率再好，也必须先问：输掉这一手之后，你还有没有下一手。'],['小仓试错','给上行留门，但把错误成本锁死。',-1,{r:5,c:-4,s:1},'小仓不是胆小，而是在购买继续学习的资格。'],['完全不做','尾部风险超过我愿意承担的边界。',-1,{r:0,c:0,s:-5},'不下注也是下注：你用机会成本换了生存确定性。']]},{a:1,ax:'FM',q:'管理层依旧乐观，但行业价格和订单数据连续转弱。',ctx:'叙事还完整，外部数据开始拆台。',o:[['继续相信管理层','公司内部信息更接近真实经营。',1,{r:-4,c:0,s:6},'长期逻辑不能靠管理层措辞维持，必须能落到可观察的事实。'],['降低判断权重','外部行为数据先于故事改变。',-1,{r:1,c:8,s:-3},'真正的证据不是“听起来更可靠”，而是能改变关键假设。'],['等下一季财报','等硬数据再确认。',0,{r:-2,c:0,s:1},'等确认会减少误判，也可能让价格先完成重定价。']]},{a:2,ax:'SI',q:'你的系统连续三次止损，第四次同样的信号又出现。',ctx:'你不知道这是正常波动，还是环境已经变了。',o:[['照系统继续做','样本太少，不能因为三次失败就改规则。',1,{r:7,c:-5,s:7},'纪律的价值在于不给最近三次结果过高权重。'],['缩小仓位再做','信号还在，但先给环境变化留空间。',-1,{r:3,c:-2,s:0},'缩小仓位是一种中间答案：既不否定系统，也不假装环境没变。'],['暂停这个信号','先重新验证，证明有效后再恢复。',-1,{r:0,c:0,s:-6},'暂停不是认输，而是把未知从仓位里拿出来。']]},{a:2,ax:'HT',q:'你空仓 18 天，市场每天都有“看起来还行”的机会。',ctx:'没有哪一个达到你原来的标准，但无聊开始变得难受。',o:[['继续空仓','没有 Edge，就不制造动作。',1,{r:0,c:0,s:-9},'等待不是空白，而是拒绝为缓解焦虑付交易成本。'],['做一个次优机会','保持手感，也许市场会给反馈。',-1,{r:3,c:-4,s:5},'行动确实能换信息，但“想动”不等于“值得动”。'],['分散做三笔','降低单笔风险，用组合探索。',-1,{r:1,c:-7,s:2},'分散并不会自动消灭同一个市场因子的风险。']]},{a:2,ax:'FM',q:'所有人都在引用同一份公开数据看多，你也认同这份数据。',ctx:'问题不再是数据对不对，而是它还值不值得交易。',o:[['继续按数据下注','公开不代表无效，关键是因果解释是否更深。',1,{r:4,c:-5,s:2},'优势可以来自同一事实的更深解释，不一定来自秘密信息。'],['先看价格位置','人人都知道的好消息，可能已经很贵。',-1,{r:2,c:0,s:-2},'正确的事实加上错误的价格，仍然可能是一笔坏交易。'],['等分歧出现','没有预期差，就没有必要强行形成观点。',0,{r:0,c:0,s:-4},'没有分歧时不下注，往往比努力制造独立观点更诚实。']]},{a:3,ax:'SI',q:'过去两年最有效的模型突然失灵，但你还说不清为什么。',ctx:'你面对的不是一条坏消息，而是“游戏可能已经换了”。',o:[['继续按模型','长期有效的方法不能被短期异常轻易推翻。',1,{r:-8,c:0,s:12},'模型最危险的时刻，往往是它从“方法”变成“身份”。'],['立刻降权','先把风险拿掉，再研究新环境。',-1,{r:1,c:10,s:-6},'先降权让你有资格慢慢理解，而不是拿资本赌解释。'],['保留小仓观察','让真实市场继续提供样本。',-1,{r:0,c:4,s:-2},'小仓观察把“我要知道答案”改成“我愿意为信息付多少学费”。']]},{a:3,ax:'HT',q:'你看好的资产逻辑仍在，但一年没有任何催化，机会成本越来越明显。',ctx:'没有亏损，也可能在持续付钱。',o:[['继续持有','赔率没变，时间不是错误本身。',1,{r:5,c:0,s:1},'等待只有在逻辑和赔率仍成立时才叫纪律，否则只是惯性。'],['换到更快的机会','资本要去效率更高的地方。',-1,{r:8,c:-3,s:3},'主动调仓会提高周转，也会让你更依赖下一次判断继续正确。'],['卖一半保留一半','把时间问题变成仓位问题。',-1,{r:4,c:9,s:-2},'当答案不确定时，仓位可以表达“不完全确定”。']]},{a:3,ax:'RG',q:'最后一手：一个你极有把握的机会，需要你押上账户 55%。',ctx:'如果错，未来三年你几乎失去再次大下注的能力；如果对，账户会跨一个台阶。',o:[['押上去','极少数真正的 Edge 就应该被重仓。',1,{r:24,c:-35,s:22},'高确信最容易把“有优势”偷换成“可以承受任何失败”。'],['控制在 20%','让正确有意义，但错误不能决定余生。',-1,{r:10,c:-12,s:4},'真正成熟的火力，不是最大下注，而是最大可承受下注。'],['放弃','任何会夺走下一手机会的下注都不值得。',-1,{r:0,c:0,s:-8},'有时最好的交易不是收益最高，而是永远保留继续下注的资格。']]}];let st;function fresh(mode='normal'){return{mode,i:0,stage:'intro',eq:1000000,cash:340000,peak:1000000,dd:0,stress:18,axes:{RG:0,FM:0,SI:0,HT:0},last:{RG:0,FM:0,SI:0,HT:0},hist:[1000000],answers:[],seed:(Date.now()>>>0)||1,settle:null}}function load(){try{st=JSON.parse(localStorage.getItem('fintype_v5'))||fresh()}catch{st=fresh()}}function save(){localStorage.setItem('fintype_v5',JSON.stringify(st))}function rnd(){let x=st.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;st.seed=x>>>0;return(st.seed%10000)/10000}function money(n){return'¥'+Math.round(n).toLocaleString('zh-CN')}function pct(n){return(n>=0?'+':'')+n.toFixed(1)+'%'}function drawdown(){return-Math.max(0,(st.peak-st.eq)/st.peak*100)}function header(){return`<div class="topbar"><div class="brand">FIN<em>·</em>TYPE</div><div class="version">financial decision simulator</div></div>`}function hud(){const ret=(st.eq/1000000-1)*100;return`<div class="hud"><div class="hudbox"><div class="huditem"><small>账户净值</small><b>${money(st.eq)}</b></div><div class="huditem"><small>总收益</small><b class="${ret>=0?'pos':'neg'}">${pct(ret)}</b></div><div class="huditem"><small>最大回撤</small><b class="neg">${pct(st.dd)}</b></div><div class="huditem"><small>压力</small><b>${Math.round(st.stress)}/100</b></div></div></div>`}function spark(){const arr=st.hist.slice(-14),min=Math.min(...arr)*.98,max=Math.max(...arr)*1.02,pts=arr.map((v,i)=>`${i/(Math.max(1,arr.length-1))*100},${88-(v-min)/(max-min||1)*76}`).join(' ');return`<svg class="spark" viewBox="0 0 100 92" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9df0c5"/><stop offset="1" stop-color="#9df0c5" stop-opacity="0"/></linearGradient></defs><polygon class="area" points="0,92 ${pts} 100,92"/><polyline points="${pts}"/></svg>`}function render(){window.scrollTo({top:0,behavior:'instant'});if(st.stage==='intro')intro();else if(st.stage==='settle')settle();else if(st.stage==='interlude')interlude();else if(st.stage==='result')result();else question()}function intro(){app.innerHTML=`<div class="wrap">${header()}<section class="hero"><div class="tape">你有 100 万。市场会给你 12 次选择。</div><h1>你最后留下的，<br/>不只是钱。</h1><p>这不是“你更像哪种投资者”的问卷。你会经历一轮<strong>上涨、回撤、无聊和规则切换</strong>。每一个选择都会改变账户，也会暴露你在不确定性下真正依赖的东西。</p><div class="ticket"><div class="ticket-row"><div class="ticket-cell"><small>起始资金</small><b>¥1,000,000</b></div><div class="ticket-cell"><small>市场回合</small><b>12</b></div><div class="ticket-cell"><small>决策轴</small><b>4</b></div><div class="ticket-cell"><small>最终人格</small><b>16</b></div></div><button class="cta" onclick="FT.start()">进入市场</button>${st.i>0?`<button class="subcta" onclick="FT.resume()">继续上次进度</button>`:''}<div class="fine">结果反映决策偏好，不是心理诊断或投资建议。账户输赢也不代表人格优劣。</div></div></section></div>`}function question(){const q=Q[st.i],act=ACTS[q.a];const progress=st.i/Q.length*100;app.innerHTML=`<div class="wrap">${header()}${hud()}<div class="chapter"><div><small>ACT ${act.n}</small><h2>${act.title}</h2></div><div class="round">ROUND ${String(st.i+1).padStart(2,'0')} / 12</div></div><div class="meter"><i style="width:${progress}%"></i></div><section class="market"><div class="market-head"><span>ACCOUNT TAPE</span><b>${money(st.eq)}</b></div>${spark()}<div class="tickerline"><div class="ticker">现金<strong>${Math.round(st.cash/st.eq*100)}%</strong></div><div class="ticker">回撤<strong>${pct(drawdown())}</strong></div><div class="ticker">压力<strong>${Math.round(st.stress)}</strong></div><div class="ticker">可选动作<strong>${Math.max(1,100-Math.round(st.stress))}</strong></div></div></section><section class="prompt"><h3>${q.q}</h3><p>${q.ctx}</p></section><div class="choices">${q.o.map((o,idx)=>`<button class="choice" onclick="FT.pick(${idx})"><span class="key">${String.fromCharCode(65+idx)}</span><span><b>${o[0]}</b><p>${o[1]}</p></span><span class="risk">${idx===0?'放大结果':idx===1?'保留弹性':'改变路径'}</span></button>`).join('')}</div><div class="toolbar"><button class="ghost" onclick="FT.restart()">重新开局</button><span style="font-size:11px;color:#627a6d">选择不可撤回 · 像市场一样</span></div></div>`}function pick(idx){const q=Q[st.i],o=q.o[idx],axis=q.ax,dir=o[2];st.axes[axis]+=dir;if(dir)st.last[axis]=dir;let noise=(rnd()-.5)*(st.mode==='chaos'?8:3);let r=o[3].r+noise;let old=st.eq;st.eq=Math.max(90000,st.eq*(1+r/100));st.cash=Math.min(st.eq,Math.max(0,st.cash+st.eq*(o[3].c/100)));st.stress=Math.max(0,Math.min(100,st.stress+o[3].s+Math.max(0,-r)*.35));st.peak=Math.max(st.peak,st.eq);st.dd=Math.min(st.dd,drawdown());st.hist.push(st.eq);st.answers.push({i:st.i,idx,axis,dir,r,old,newEq:st.eq});st.settle={idx,o,r,lesson:o[4],old,eq:st.eq};st.i++;st.stage='settle';save();render()}function settle(){const s=st.settle,ret=(s.eq/s.old-1)*100;app.innerHTML=`<div class="wrap">${header()}${hud()}<section class="settle"><div class="stamp">MARKET CLOSED · ROUND ${String(st.i).padStart(2,'0')}</div><div class="move ${ret>=0?'pos':'neg'}">${pct(ret)}</div><h3>${s.o[0]}</h3><p>这一手市场已经结算。结果会影响账户，但不会替你证明这次决定“对”或“错”。</p><div class="settle-grid"><div class="settle-stat"><small>本手前</small><b>${money(s.old)}</b></div><div class="settle-stat"><small>本手后</small><b>${money(s.eq)}</b></div><div class="settle-stat"><small>当前现金</small><b>${money(st.cash)}</b></div></div><div class="lesson">${s.lesson}</div><button class="cta" onclick="FT.next()">${st.i>=Q.length?'查看你的 FIN·TYPE':'继续下一手'}</button></section></div>`}function next(){if(st.i>=Q.length){st.stage='result';save();return render()}const prev=Q[st.i-1],next=Q[st.i];if(prev.a!==next.a){st.stage='interlude'}else st.stage='question';save();render()}function interlude(){const a=ACTS[Q[st.i].a];app.innerHTML=`<div class="wrap">${header()}${hud()}<section class="interlude"><div class="roman">ACT ${a.n}</div><h2>${a.title}</h2><p>${a.desc}</p><div class="quote">真正的测试从来不是“你喜欢什么”，而是环境变化以后，你还会不会用同一套方式下注。</div><button class="cta" onclick="FT.enterAct()">进入下一幕</button></section></div>`}function code(){return Object.keys(AX).map(k=>{let v=st.axes[k];if(v===0)v=st.last[k]||1;return v>0?AX[k][0]:AX[k][1]}).join('')}function axisPct(k){const n=Q.filter(x=>x.ax===k).length;let v=st.axes[k];return Math.round((v+n)/(2*n)*100)}function strongest(){let best=null,bv=-1;Object.keys(AX).forEach(k=>{let v=Math.abs(st.axes[k]);if(v>bv){bv=v;best=k}});return best}function signature(c){const k=strongest(),v=st.axes[k]>=0?0:1;const label=AX[k][2+v];const map={RG:['你最稳定的本能不是追求最大收益，而是先保住下一手。','你最稳定的本能是：当优势出现时，愿意让正确变得昂贵。'],FM:['你最终仍会回到事实、经营与因果链上。','你最终仍会回到价格、资金与市场行为上。'],SI:['你需要一套可重复规则来约束自己。','你愿意让现场变化直接改写动作。'],HT:['你相信时间能把赔率兑现出来。','你相信主动调整能降低机会成本。']};return[label,map[k][v]]}function insightLetters(c){const t={R:['你的系统天然保护生存。','当真正稀缺的机会出现，你可能把“谨慎”继续带进该进攻的时刻。'],G:['你愿意让资本替确信投票。','你的最大风险不是看错，而是一次错误把未来下注能力一起拿走。'],F:['你相信事实最终约束价格。','你可能低估“大家都知道”之后价格已经走了多远。'],M:['你尊重市场比故事更早投票。','你可能把价格从证据升级成真理。'],S:['你相信规则可以抵抗情绪。','环境变化时，规则可能成为惯性。'],I:['你擅长临场修正。','自由度越高，越容易把事后解释当成当时判断。'],H:['你相信等待能换来赔率。','耐心最怕被用在已经失效的判断上。'],T:['你相信主动调整提高资本效率。','频繁更换答案会让你越来越依赖下一次继续判断正确。']};return c.split('').map(x=>t[x])}function result(){const c=code(),meta=TYPE[c],ret=(st.eq/1000000-1)*100,sig=signature(c),ins=insightLetters(c);app.innerHTML=`<div class="wrap">${header()}<section class="result"><div class="result-hero"><div class="result-kicker">YOUR FINANCIAL DECISION TYPE</div><div class="code">${c}</div><div class="result-name">${meta[0]}</div><div class="result-summary">${meta[1]}</div></div><div class="outcome-band"><div><small>终局净值</small><b>${money(st.eq)}</b></div><div><small>总收益</small><b class="${ret>=0?'pos':'neg'}">${pct(ret)}</b></div><div><small>最大回撤</small><b class="neg">${pct(st.dd)}</b></div><div><small>终局压力</small><b>${Math.round(st.stress)}/100</b></div></div><div class="axislist">${Object.keys(AX).map(k=>{const p=axisPct(k),right=p<50,sel=right?AX[k][3]:AX[k][2],degree=right?100-p:p;return`<div><div class="axisrow"><span>${AX[k][2]}</span><div class="axistrack"><i style="left:${p}%"></i></div><span class="r">${AX[k][3]}</span></div><div class="axisdegree">${sel} ${degree}%</div></div>`}).join('')}</div><div class="signature"><small>你的签名动作</small><b>${sig[0]}</b><p>${sig[1]}</p></div><div class="insights"><div class="insight"><small>NATURAL EDGE</small><h4>${ins[0][0]}</h4><p>${ins[1][0]} ${ins[2][0]}</p></div><div class="insight danger"><small>KILL ZONE</small><h4>${ins[0][1]}</h4><p>${ins[2][1]} ${ins[3][1]}</p></div><div class="insight counter"><small>COUNTER MOVE</small><h4>训练与你相反的那一侧</h4><p>下一次最确信时，把仓位减半；最想动时，强制多等一拍；最想等时，写出停止条件。不是改变人格，而是给人格加刹车。</p></div><div class="insight"><small>ACCOUNT PATH</small><h4>结果不是评分</h4><p>这一局赚得多或少，只说明某条路径发生了什么。FIN·TYPE 记录的是你如何下注，而不是拿一局结果给你贴“高手/菜鸟”标签。</p></div></div><div class="share"><button class="primary2" onclick="FT.share()">分享我的 FIN·TYPE</button><button class="secondary" onclick="FT.chaos()">Chaos Mode 再来一局</button></div><div class="notice">FIN·TYPE 是金融决策人格实验，不是经心理测量学验证的诊断工具，也不构成任何投资建议。</div></section></div>`}function start(){st=fresh('normal');st.stage='question';save();render()}function resume(){st.stage=st.i>=Q.length?'result':'question';save();render()}function restart(){if(confirm('重新开局会清空这一局。')){st=fresh(st.mode);save();render()}}function chaos(){st=fresh('chaos');st.stage='question';save();render()}async function share(){const c=code(),m=TYPE[c],ret=(st.eq/1000000-1)*100;const txt=`我的 FIN·TYPE：${c}｜${m[0]}\n这一局：${money(st.eq)}（${pct(ret)}）\n最重要的不是赚了多少，而是我在不确定性下会怎么下注。`;if(navigator.share){try{await navigator.share({title:`FIN·TYPE｜${c} ${m[0]}`,text:txt,url:location.href});return}catch(e){if(e.name==='AbortError')return}}navigator.clipboard?.writeText(txt+'\n'+location.href).then(()=>toast('结果与链接已复制')).catch(()=>prompt('复制下面的结果',txt+'\n'+location.href))}function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}window.FT={start,resume,pick,next,enterAct(){st.stage='question';save();render()},restart,chaos,share};load();render()})();
</script></body></html>
