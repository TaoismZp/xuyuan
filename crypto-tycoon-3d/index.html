let S=null,busy=false,dice=1,tilted=true,overlayOpen=false;
const app=document.getElementById('app'),toastEl=document.getElementById('toast');
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1700)}
function save(){try{localStorage.setItem('crypto-tycoon-3d',JSON.stringify(S))}catch(e){}}
function loadSaved(){try{return JSON.parse(localStorage.getItem('crypto-tycoon-3d')||'null')}catch(e){return null}}
function ownedBy(pid){return Object.entries(S.owners).filter(([,o])=>o===pid).map(([i])=>+i)}
function sectorComplete(pid,sector){const ids=tiles.map((t,i)=>t.type==='asset'&&assets[t.asset].sector===sector?i:null).filter(v=>v!==null);return ids.length>1&&ids.every(i=>S.owners[i]===pid)}
function rentAt(i){const a=assets[tiles[i].asset],lvl=S.upgrades[i]||0;let r=a.rent*regimes[S.regime].rent*(1+lvl*.5);if(sectorComplete(S.owners[i],a.sector))r*=1.5;return Math.round(r)}
function netWorth(p){let v=p.cash;ownedBy(p.id).forEach(i=>{const a=assets[tiles[i].asset],lvl=S.upgrades[i]||0;v+=a.cost*regimes[S.regime].mult*(1+lvl*.34)});return Math.max(0,Math.round(v))}
function log(msg){S.log.unshift(msg);S.log=S.log.slice(0,20);save()}
function newGame(){S={round:1,maxRounds:12,turn:0,regime:'sideways',pot:0,owners:{},upgrades:{},players:playersDef.map((p,id)=>({...p,id,pos:0,cash:2000000,dead:false,traits:{risk:0,survive:0,system:0}})),log:['<strong>链上开盘。</strong> 四名玩家各拿到 ¥200万。'],history:[100],gameover:false,started:true};busy=false;dice=1;overlayOpen=false;save();render()}
function intro(){const has=loadSaved()?.started&&!loadSaved()?.gameover;return `<div class="topbar"><div class="brand"><div class="brandmark">₿</div><div><b>币圈大富翁 3D</b><span>CRYPTO TYCOON · ON-CHAIN BOARD GAME</span></div></div><div class="top-actions"><button class="mini-btn" data-action="rules">规则</button></div></div><section class="intro"><div class="hero-copy"><div class="eyebrow">PLAYABLE 3D BOARD GAME · SOLO VS 3 BOTS</div><h1>别只想翻倍。<br><span>先别爆仓。</span></h1><p>拿着 <strong>¥200万</strong> 上桌，和「巨鲸」「量化」「钻石手」跑完一轮完整加密周期。买 BTC、ETH、SOL，也会遇见空投、减半、DeFi、巨鲸砸盘、Meme 狂热与强平。<strong>12 轮后净值最高且还活着的人赢。</strong></p><div class="hero-pills"><span class="pill">24 格 3D 棋盘</span><span class="pill">12 种资产</span><span class="pill">牛熊周期</span><span class="pill">4 名玩家</span><span class="pill">自动存档</span></div><div class="hero-actions"><button class="primary" data-action="new">开始一局</button>${has?'<button class="secondary" data-action="continue">继续上局</button>':''}</div><div class="fine">纯娱乐模拟，不构成投资建议。</div></div><div class="hero-stage"><div class="mini-board">${Array.from({length:36},(_,i)=>i<6||i>29||i%6===0||i%6===5?'<div class="mini-tile"></div>':'<div></div>').join('')}</div></div></section>`}
function boardHTML(){const me=S.players[0],rg=regimes[S.regime],hist=S.history.slice(-18);while(hist.length<18)hist.unshift(100);const mn=Math.min(...hist)-2,mx=Math.max(...hist)+2,pts=hist.map((v,i)=>`${i/(hist.length-1)*100},${38-(v-mn)/(mx-mn)*38}`).join(' ');let h='<div class="board">';tiles.forEach((t,i)=>{const [r,c]=coords[i],a=t.type==='asset'?assets[t.asset]:null,o=S.owners[i],tok=S.players.filter(p=>!p.dead&&p.pos===i).map(p=>`<span class="token" style="--pc:${p.color}" title="${p.name}">${p.icon}</span>`).join(''),lvl=S.upgrades[i]||0;const cls=`tile ${t.type} ${o!==undefined?'owned':''} ${me.pos===i?'you-here':''}`;h+=`<div class="${cls}" style="grid-row:${r};grid-column:${c};--owner:${o!==undefined?S.players[o].color:'transparent'}"><div>${lvl?`<span class="level">Lv.${lvl+1}</span>`:''}<div class="icon">${a?a.sym:t.icon}</div><div class="name">${a?a.name:t.name}</div><div class="meta">${a?money(a.cost):t.kind.toUpperCase()}</div></div><div class="tokens">${tok}</div></div>`});h+=`<div class="center"><div class="center-top"><div><div class="market-kicker">CRYPTO MARKET</div><div class="market-title">${rg.name}</div></div><div class="fear-box"><small>FEAR / GREED</small><b>${rg.fg}</b></div></div><div class="center-main"><div class="landmarks"><div class="landmark ex">🏦</div><div class="landmark rocket">🚀</div><div class="landmark whale">🐋</div><div class="landmark miner">⛏️</div></div><div class="title-plaque"><div class="crown">👑</div><h2>币圈大富翁</h2><span>CRYPTO TYCOON 3D</span></div></div><div class="center-bottom"><div class="spark"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points="${pts}" /></svg></div><div class="pot"><small>CHAIN POT</small><b>${money(S.pot)}</b></div></div></div></div>`;return h}
function leftHUD(){const list=[...S.players].sort((a,b)=>netWorth(b)-netWorth(a)).map((p,idx)=>`<div class="player-row ${p.id===0?'me':''} ${p.dead?'dead':''}"><div class="avatar">${p.icon}</div><div><div class="pname">${idx+1}. ${p.name}</div><div class="psub">现金 ${money(p.cash)} · ${ownedBy(p.id).length} 资产</div></div><div class="pvalue">${money(netWorth(p))}</div></div>`).join('');return `<div class="hud-col left-col"><div class="panel round-card"><h3>MARKET CLOCK</h3><div class="round-line"><div><small style="color:#7782a8;font-size:9px">第</small><div class="round-num">${S.round}<span style="font-size:12px;color:#7782a8"> / ${S.maxRounds}</span></div></div><span class="regime">${regimes[S.regime].name}</span></div></div><div class="panel"><h3>玩家排名</h3><div class="player-list">${list}</div></div><div class="panel"><h3>链上快讯</h3><div class="log">${S.log.map(x=>`<p>${x}</p>`).join('')}</div></div></div>`}
function portfolio(){const me=S.players[0],rows=ownedBy(0).map(i=>{const a=assets[tiles[i].asset],lvl=S.upgrades[i]||0;return `<div class="asset-row"><div><b>${a.sym} ${a.name}</b><small>${a.sector} · Lv.${lvl+1}</small></div><span>${money(Math.round(a.cost*regimes[S.regime].mult*(1+lvl*.34)))}</span></div>`}).join('');return rows||'<div class="empty">还没有资产。下一次落到无人资产时可以买入。</div>'}
function rightHUD(){const me=S.players[0],cur=S.players[S.turn];return `<div class="hud-col right-col"><div class="panel action-card"><div class="turn-label">CURRENT TURN</div><div class="turn-name">${cur.id===0?'轮到你了':cur.name+' 正在行动'}</div><div class="turn-copy">${cur.id===0?'掷骰子，在牛熊之间活到最后。':'Bot 会按照自己的风险偏好自动决策。'}</div><div class="dice-stage"><div id="die3d" class="die3d">${dice}</div></div><button id="rollBtn" class="roll-btn" ${cur.id===0&&!busy&&!me.dead?'':'disabled'}>🎲 掷骰子</button></div><div class="panel"><h3>你的资产</h3><div class="cash-grid"><div class="stat"><small>现金</small><b>${money(me.cash)}</b></div><div class="stat"><small>净值</small><b>${money(netWorth(me))}</b></div><div class="stat"><small>持仓</small><b>${ownedBy(0).length}</b></div><div class="stat"><small>本轮骰子</small><b>${dice}</b></div></div></div><div class="panel"><h3>持仓明细</h3><div class="portfolio-list">${portfolio()}</div></div></div>`}
function game(){return `<div class="topbar"><div class="brand"><div class="brandmark">₿</div><div><b>币圈大富翁 3D</b><span>CRYPTO TYCOON · ON-CHAIN BOARD GAME</span></div></div><div class="top-actions"><button class="mini-btn" data-action="view">${tilted?'俯视':'3D视角'}</button><button class="mini-btn" data-action="rules">规则</button><button class="mini-btn" data-action="restart">重开</button></div></div><div class="game-layout">${leftHUD()}<div class="scene-wrap"><div class="scene ${tilted?'tilt':''}"><div class="board-shell">${boardHTML()}</div></div></div>${rightHUD()}</div>`}
function endScreen(){const rank=[...S.players].sort((a,b)=>netWorth(b)-netWorth(a));const me=S.players[0],place=rank.findIndex(p=>p.id===0)+1;let arche='规则执行者',desc='你没有把每一次上涨都当成必须参与的机会，而是让仓位与现金决定你能活多久。';if(me.dead){arche='先下桌的人';desc='你输掉的不是最后一格，而是继续参与下一轮的资格。';}else if(me.traits.risk>me.traits.system+2){arche='高波动猎手';desc='你喜欢把波动变成赔率。强项是敢下注，弱点是容易把好判断放大成坏仓位。';}else if(me.traits.survive>me.traits.system+1){arche='生存主义者';desc='你把“不下牌桌”放在第一位。机会少吃一点没关系，先保住下一手。';}return `<div class="topbar"><div class="brand"><div class="brandmark">₿</div><div><b>币圈大富翁 3D</b><span>FINAL SETTLEMENT</span></div></div></div><section class="end"><div class="result-card"><h2>FINAL RANKING</h2><div class="champ">${rank[0].name}</div>${rank.map((p,i)=>`<div class="rank-row2"><div>#${i+1}</div><div><b>${p.icon} ${p.name}</b><small>${ownedBy(p.id).length} 资产 · 现金 ${money(p.cash)}</small></div><strong>${money(netWorth(p))}</strong></div>`).join('')}</div><div class="end-copy"><div class="eyebrow">YOUR ON-CHAIN ARCHETYPE</div><h1>${me.dead?'你爆仓了':'你是'}<br><span>${arche}</span></h1><p>${desc}</p><p>最终净值 <strong style="color:#fff">${money(netWorth(me))}</strong>，排名 #${place}。</p><div class="end-actions"><button class="primary" data-action="new">再开一局</button><button class="secondary" data-action="intro">回到首页</button></div></div></section>`}
function render(){if(!S){app.innerHTML=intro()}else if(S.gameover){app.innerHTML=endScreen()}else{app.innerHTML=game()}bind();save()}
function bind(){app.querySelectorAll('[data-action="new"]').forEach(b=>b.addEventListener('click',newGame));app.querySelectorAll('[data-action="continue"]').forEach(b=>b.addEventListener('click',()=>{S=loadSaved();render()}));app.querySelectorAll('[data-action="intro"]').forEach(b=>b.addEventListener('click',()=>{S=null;render()}));app.querySelectorAll('[data-action="rules"]').forEach(b=>b.addEventListener('click',showRules));app.querySelectorAll('[data-action="view"]').forEach(b=>b.addEventListener('click',()=>{tilted=!tilted;render()}));app.querySelectorAll('[data-action="restart"]').forEach(b=>b.addEventListener('click',()=>{if(confirm('确定重开这局？'))newGame()}));document.getElementById('rollBtn')?.addEventListener('click',userRoll)}
function showRules(){openModal(`<div class="kicker">HOW TO PLAY</div><h2>币圈大富翁规则</h2><p>落在无人资产可买入；别人落在你的资产要付链上过路费；再次落在自己的资产可升级。集齐同一板块全部资产，过路费 +50%。市场会在震荡、牛、熊、狂热、恐慌之间切换，直接影响资产估值与过路费。</p><div class="modal-stats"><div class="mstat"><small>目标</small><b>12轮净值最高</b></div><div class="mstat"><small>底线</small><b>别爆仓</b></div><div class="mstat"><small>起始现金</small><b>¥200万</b></div></div><div class="modal-actions"><button class="choice" data-modal="close"><b>知道了</b><span>上桌，先活下来。</span></button></div>`)}
function openModal(html){overlayOpen=true;const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(o);o.querySelectorAll('[data-modal="close"]').forEach(b=>b.addEventListener('click',()=>closeModal()));return o}
function closeModal(){document.querySelector('.overlay')?.remove();overlayOpen=false;render()}
async function userRoll(){if(busy||!S||S.gameover||S.turn!==0||S.players[0].dead)return;busy=true;dice=1+Math.floor(rnd()*6);render();document.getElementById('die3d')?.classList.add('rolling');await sleep(500);await move(0,dice);await land(0);busy=false;if(!overlayOpen)await nextTurn()}
async function move(pid,n){const p=S.players[pid];for(let k=0;k<n;k++){p.pos=(p.pos+1)%24;if(p.pos===0){p.cash+=180000;S.pot+=20000;log(`<strong>${p.name}</strong> 穿越起点，获得 ${money(180000)} 区块奖励。`)}render();await sleep(90)}save()}
function botWantsBuy(p,a){const reserve=p.style==='whale'?520000:p.style==='quant'?650000:420000;if(p.cash-a.cost<reserve)return false;if(p.style==='whale')return a.sector==='CORE'||a.cost>320000||rnd()<.35;if(p.style==='quant')return a.rent/a.cost>.17||rnd()<.22;if(p.style==='diamond')return a.vol<1.4||rnd()<.42;return true}
function buy(pid,i){const p=S.players[pid],a=assets[tiles[i].asset];if(p.cash<a.cost)return;p.cash-=a.cost;S.owners[i]=pid;S.upgrades[i]=0;p.traits.system++;log(`<strong>${p.name}</strong> 买入 ${a.name}，成本 ${money(a.cost)}。`);solvency(pid);save();render()}
function upgrade(pid,i){const p=S.players[pid],a=assets[tiles[i].asset],lvl=S.upgrades[i]||0,cost=Math.round(a.cost*.5);if(lvl>=2||p.cash<cost)return;p.cash-=cost;S.upgrades[i]=lvl+1;p.traits.risk++;log(`<strong>${p.name}</strong> 对 ${a.name} 加仓，升至 Lv.${lvl+2}。`);solvency(pid);save();render()}
async function land(pid){const p=S.players[pid],i=p.pos,t=tiles[i];if(t.type==='asset')return assetLand(pid,i);return specialLand(pid,t)}
function assetLand(pid,i){const p=S.players[pid],a=assets[tiles[i].asset],owner=S.owners[i];if(owner===undefined){if(pid!==0){if(botWantsBuy(p,a))buy(pid,i);return Promise.resolve()}return new Promise(resolve=>{const o=openModal(`<div class="kicker">UNOWNED · ${a.sector}</div><h2>${a.sym} ${a.name}</h2><p>买下后，其他玩家落到这里会向你支付链上过路费。</p><div class="modal-stats"><div class="mstat"><small>价格</small><b>${money(a.cost)}</b></div><div class="mstat"><small>基础过路费</small><b>${money(a.rent)}</b></div><div class="mstat"><small>波动</small><b>${'●'.repeat(Math.ceil(a.vol))}${'○'.repeat(Math.max(0,2-Math.ceil(a.vol)))}</b></div></div><div class="modal-actions"><button class="choice good" data-buy="1"><b>买入 ${a.name}</b><span>买后现金 ${money(p.cash-a.cost)}</span></button><button class="choice" data-skip="1"><b>跳过</b><span>保留现金，等待下一格。</span></button></div>`);const done=()=>{document.querySelector('.overlay')?.remove();overlayOpen=false;resolve()};o.querySelector('[data-buy]')?.addEventListener('click',()=>{if(p.cash>=a.cost){buy(pid,i);done()}else{toast('现金不够');}});o.querySelector('[data-skip]')?.addEventListener('click',()=>{p.traits.survive++;done()});})}
if(owner===pid){const lvl=S.upgrades[i]||0,cost=Math.round(a.cost*.5);if(lvl>=2)return Promise.resolve();if(pid!==0){if(p.cash-cost>(p.style==='quant'?620000:360000)&&rnd()>.42)upgrade(pid,i);return Promise.resolve()}return new Promise(resolve=>{const o=openModal(`<div class="kicker">YOUR ASSET</div><h2>${a.name} · Lv.${lvl+1}</h2><p>继续加仓会提高过路费，也会减少你的现金安全垫。</p><div class="modal-stats"><div class="mstat"><small>升级成本</small><b>${money(cost)}</b></div><div class="mstat"><small>当前租金</small><b>${money(rentAt(i))}</b></div><div class="mstat"><small>升级后</small><b>约 +50%</b></div></div><div class="modal-actions"><button class="choice good" data-up="1"><b>加仓升级</b><span>把赔率放大，也把仓位放大。</span></button><button class="choice" data-skip="1"><b>不加仓</b><span>保留下一手的现金。</span></button></div>`);const done=()=>{document.querySelector('.overlay')?.remove();overlayOpen=false;resolve()};o.querySelector('[data-up]')?.addEventListener('click',()=>{if(p.cash>=cost){upgrade(pid,i);done()}else toast('现金不够');});o.querySelector('[data-skip]')?.addEventListener('click',()=>{p.traits.survive++;done()});})}
const fee=rentAt(i),op=S.players[owner];p.cash-=fee;op.cash+=fee;log(`<strong>${p.name}</strong> 落在 ${op.name} 的 ${a.name}，支付 ${money(fee)} 链上过路费。`);solvency(pid);save();render();return Promise.resolve()}
async function specialLand(pid,t){const p=S.players[pid];const affect=(delta,msg)=>{p.cash+=delta;log(`<strong>${p.name}</strong> ${msg} ${delta>=0?'+':''}${money(delta)}。`);solvency(pid)};switch(t.kind){case'start':break;case'exchange':affect(60000,'完成一次低滑点套利');p.traits.system++;break;case'airdrop':affect(120000+Math.floor(rnd()*180000),'领到空投');break;case'mine':{const d=rnd()<.66?140000:-90000;affect(d,d>0?'矿机幸运出块':'矿机宕机维修');break}case'halving':affect(120000,'提前布局减半叙事');S.regime=rnd()>.35?'bull':'sideways';break;case'nft':{const d=rnd()<.5?210000:-150000;affect(d,d>0?'卖出稀有 NFT':'NFT 地板价跳水');break}case'whale':{const up=rnd()>.48;S.regime=up?'bull':'panic';log(`<strong>巨鲸异动</strong>，市场切换为 ${regimes[S.regime].name}。`);break}case'staking':affect(90000,'质押收益到账');p.traits.survive++;break;case'liquidation':{const d=-Math.max(220000,Math.round(p.cash*.22));affect(d,'遭遇强平');p.traits.risk+=2;break}case'bear':S.regime='bear';log(`<strong>${p.name}</strong> 撞上熊市，市场风险偏好骤降。`);break;case'bull':S.regime='bull';log(`<strong>${p.name}</strong> 点燃牛市，全场估值上移。`);break;case'vault':affect(80000,'进入金库避险并收取利息');p.traits.survive++;break}marketTick(t.kind);save();render()}
function marketTick(trigger){let last=S.history[S.history.length-1];let drift={bull:6,bear:-6,mania:10,panic:-10,sideways:0}[S.regime]+(rnd()-.5)*8;if(trigger==='halving')drift+=4;if(trigger==='whale')drift+=(rnd()-.5)*10;S.history.push(Math.max(28,last+drift));S.history=S.history.slice(-30)}
function solvency(pid){const p=S.players[pid];if(p.cash>=0)return;const owned=ownedBy(pid).sort((a,b)=>assets[tiles[a].asset].cost-assets[tiles[b].asset].cost);while(p.cash<0&&owned.length){const i=owned.shift(),a=assets[tiles[i].asset],lvl=S.upgrades[i]||0,recover=Math.round(a.cost*regimes[S.regime].mult*(1+lvl*.34)*.7);delete S.owners[i];delete S.upgrades[i];p.cash+=recover;log(`<strong>${p.name}</strong> 被迫折价卖出 ${a.name}，回笼 ${money(recover)}。`)}if(p.cash<0){p.dead=true;p.cash=0;log(`<strong>${p.name}</strong> 爆仓出局。`);if(pid===0){S.gameover=true}}}
async function nextTurn(){if(S.gameover)return render();let attempts=0;do{S.turn=(S.turn+1)%S.players.length;attempts++;if(S.turn===0){S.round++;if(S.round>S.maxRounds){S.gameover=true;return render()}cycleMarket()}}while(S.players[S.turn].dead&&attempts<8);save();render();if(S.turn!==0&&!S.gameover)await botTurn()}
function cycleMarket(){const r=rnd();S.regime=r<.18?'bear':r<.32?'panic':r<.57?'sideways':r<.82?'bull':'mania';marketTick();log(`<strong>第 ${S.round} 轮</strong> 开始：市场进入 ${regimes[S.regime].name}。`)}
async function botTurn(){if(busy||S.gameover)return;busy=true;await sleep(380);const p=S.players[S.turn];dice=1+Math.floor(rnd()*6);render();document.getElementById('die3d')?.classList.add('rolling');await sleep(450);await move(p.id,dice);await land(p.id);busy=false;await sleep(260);await nextTurn()}
function endIfOnlyOne(){const alive=S.players.filter(p=>!p.dead);if(alive.length<=1){S.gameover=true;render();return true}return false}
const oldSolv=solvency;solvency=function(pid){oldSolv(pid);endIfOnlyOne()};
window.render_game_to_text=()=>JSON.stringify({round:S?.round,turn:S?.turn,regime:S?.regime,dice,players:S?.players?.map(p=>({name:p.name,pos:p.pos,cash:p.cash,net:S?netWorth(p):0,dead:p.dead,assets:S?ownedBy(p.id).length:0})),owners:S?.owners,gameover:S?.gameover});
window.advanceTime=async(ms=1000)=>{await sleep(ms)};
if(params.get('autoplay')==='1')newGame();else render();
})();
</script>
</body>
</html>
