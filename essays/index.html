<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f0e8" />
  <meta name="description" content="TaoismZp 的长文主页。" />
  <title>长文 · TaoismZp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header shell">
    <a class="brand" href="./" aria-label="返回首页">
      <span class="brand-mark">文</span>
      <span class="brand-copy"><strong>长文</strong><small>TaoismZp</small></span>
    </a>
    <nav class="nav" aria-label="主导航">
      <button class="nav-button" id="searchToggle" type="button">搜索</button>
      <a href="write.html">发文</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式">◐</button>
    </nav>
  </header>

  <main>
    <section class="hero shell">
      <p class="eyebrow">LONGFORM / ESSAYS</p>
      <h1>把值得留下来的东西，<br />写得足够长。</h1>
      <p class="hero-note">一个专门放长文的地方。没有信息流，没有热榜，只有文章本身。</p>
      <div class="hero-rule"></div>
    </section>

    <section class="search-panel shell" id="searchPanel" hidden>
      <label for="searchInput">搜索文章</label>
      <div class="search-row">
        <input id="searchInput" type="search" inputmode="search" placeholder="标题、摘要或标签…" autocomplete="off" />
        <button id="searchClose" type="button">关闭</button>
      </div>
    </section>

    <section class="library shell" aria-labelledby="libraryTitle">
      <div class="section-head">
        <div>
          <p class="eyebrow">ARCHIVE</p>
          <h2 id="libraryTitle">全部文章</h2>
        </div>
        <div class="filter-wrap" id="tagFilters" aria-label="文章标签"></div>
      </div>
      <div class="article-list" id="articleList">
        <div class="loading">正在整理书架…</div>
      </div>
      <p class="empty" id="emptyState" hidden>没有找到匹配的文章。</p>
    </section>
  </main>

  <footer class="footer shell">
    <p>© <span id="year"></span> TaoismZp</p>
    <p>写给愿意慢一点读的人。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
