function start(){S={round:1,maxRounds:12,turn:0,regime:'sideways',pot:0,owners:{},upgrades:{},players:P.map((p,id)=>({...p,id,pos:0,cash:120000,stress:12,dead:false,traits:{degen:0,survive:0,system:0,contrarian:0}})),log:['链上开盘。每个人拿到 ¥12万。'],history:[100],started:true,gameover:false};save();U.overlay=null;render()}
function load(){try{S=JSON.parse(localStorage.getItem('chain-tycoon'));if(S?.started&&!S.gameover){render();return}}catch(e){}start()}
function board(){let h='<div class="board">';T.forEach((t,i)=>{let [r,c]=C[i],a=t.type==='asset'?A[t.asset]:null,o=S.owners[i],tok=S.players.filter(p=>!p.dead&&p.pos===i).map(p=>`<span class="token" style="background:${p.color}">${p.icon[0]}</span>`).join('');h+=`<div class="tile ${t.type}${o!==undefined?' owned':''}${S.players[0].pos===i?' you-here':''}" style="grid-row:${r};grid-column:${c};--owner:${o!==undefined?S.players[o].color:'transparent'}"><div><div class="sym">${a?a.sym:t.sym}</div><div class="name">${a?a.name:t.name}</div><div class="meta">${a?money(a.cost):t.kind.toUpperCase()}</div><div class="ownerline"></div></div><div class="tokens">${tok}</div></div>`});let rg=R[S.regime],hist=S.history.slice(-14);while(hist.length<14)hist.unshift(100);let mn=Math.min(...hist),mx=Math.max(...hist);if(mx-mn<10){mx+=5;mn-=5}let pts=hist.map((v,i)=>`${i/(hist.length-1)*100},${100-(v-mn)/(mx-mn)*100}`).join(' ');return h+`<div class="board-center"><div class="market-top"><div><div class="market-kicker">CRYPTO MARKET</div><div class="market-regime ${rg.class}">${rg.name}</div></div><div class="fear"><small>FEAR / GREED</small><b>${rg.fg}</b></div></div><div class="market-chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}"/></svg></div><div class="center-bottom"><div class="roundbox"><small>ROUND</small><b>${S.round} / 12</b></div><div class="potbox"><small>CHAIN POT</small><b>${money(S.pot)}</b></div></div></div></div>`}
function side(){let me=S.players[0],cur=S.players[S.turn],players=S.players.map(p=>`<div class="player ${p.dead?'dead':''}"><span class="dot" style="background:${p.color}"></span><div><b>${p.name}</b><small>现金 ${money(p.cash)} · ${Object.values(S.owners).filter(x=>x===p.id).length} 资产</small></div><div class="worth">${money(nw(p))}</div></div>`).join(''),secs=['CORE','BETA','INFRA','YIELD'].map(s=>`<span class="sector-tag ${sector(0,s)?'complete':''}">${s}</span>`).join('');return `<div class="side"><div class="panel turn-card"><div class="turn-label">CURRENT TURN</div><div class="turn-title">${cur.id===0?'轮到你了':cur.name+' 正在行动'} <span class="dice"><span class="die">${U.dice}</span></span></div><div class="turn-copy">${cur.id===0?'掷骰子。真正的大钱通常不是输在一格，而是输在一个周期里。':'Bot 会按照自己的风险偏好自动决策。'}</div><button id="roll" class="rollbtn" ${cur.id===0&&!U.busy&&!me.dead?'':'disabled'}>掷骰子</button></div><div class="panel"><h3>玩家净值</h3><div class="players">${players}</div></div><div class="panel"><h3>你的仓位</h3><div class="portfolio"><div class="port"><small>现金</small><b>${money(me.cash)}</b></div><div class="port"><small>净值</small><b>${money(nw(me))}</b></div><div class="port"><small>压力</small><b>${Math.round(me.stress)} / 100</b></div><div class="port"><small>资产</small><b>${Object.values(S.owners).filter(x=>x===0).length}</b></div></div><div class="sector-strip" style="margin-top:10px">${secs}</div></div><div class="panel"><h3>链上快讯</h3><div class="log">${S.log.map(x=>`<p>${x}</p>`).join('')}</div></div></div>`}
function intro(){let has=localStorage.getItem('chain-tycoon');return `<div class="shell"><div class="topbar"><div class="brand"><div class="brandmark">◇</div><div><b>CHAIN TYCOON</b><span> 链上大亨</span></div></div><button class="tinybtn" id="rules">规则</button></div><section class="intro"><div class="intro-copy"><div class="eyebrow">A CRYPTO BOARD GAME · SOLO VS 3 BOTS</div><h1>别爆仓。<br/><em>先活到最后。</em></h1><p>你有 <strong>¥12万</strong>，和巨鲸、量化、钻石手坐上一张链上牌桌。买资产、收过路费、扛牛熊、吃空投，也可能遇上 Rug、Hack 和清算。最后比的不是谁最敢，而是谁的<strong>净值最高且还活着</strong>。</p><div class="ruleline"><span class="pill">12 轮</span><span class="pill">4 名玩家</span><span class="pill">24 格棋盘</span><span class="pill">12 种资产</span><span class="pill">断点续玩</span></div><div class="intro-actions"><button class="primary" id="new">开一局</button>${has?'<button class="secondary" id="continue">继续上局</button>':''}</div><div class="fine">纯娱乐模拟，不构成投资建议。</div></div><div class="preview-card"><div class="preview-head"><div class="preview-title">LIVE MARKET</div><div class="regime-chip">BULL RUN</div></div><div class="mock-chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="0,82 8,74 16,78 25,60 34,66 44,48 54,52 63,31 72,38 82,22 92,28 100,10"/></svg></div><div class="mock-stats"><div><small>START</small><b>¥12万</b></div><div><small>WIN</small><b>最高净值</b></div><div><small>RISK</small><b>爆仓出局</b></div></div></div></section></div>`}
function arche(){let t=S.players[0].traits,k=Object.entries(t).sort((a,b)=>b[1]-a[1])[0]?.[0]||'system';return {degen:['高波动猎手','你愿意用波动换赔率。强项是抓加速，弱点是把好判断放大成坏仓位。'],survive:['生存主义者','你先保护下一手，再考虑这一手能赚多少。代价是稀缺机会出现时可能下注不够。'],system:['规则执行者','你更愿意让证据和规则替你做决定。弱点是规则失效时可能反应偏慢。'],contrarian:['逆向下注者','你会在别人恐惧时找赔率。危险是：有时市场不是错了，只是你太早。']}[k]}
function end(){let rank=[...S.players].sort((a,b)=>nw(b)-nw(a)),[a,d]=arche();return `<div class="shell"><section class="end"><div class="rank-card"><div class="rank-title">FINAL RANKING</div><div class="champion">${rank[0].name}</div><div class="rank-list">${rank.map((p,i)=>`<div class="rank-row"><div>#${i+1}</div><div><b>${p.name}</b><small>${Object.values(S.owners).filter(x=>x===p.id).length} 资产 · 现金 ${money(p.cash)}</small></div><div class="rank-value">${money(nw(p))}</div></div>`).join('')}</div></div><div class="end-copy"><div class="eyebrow" style="color:var(--green);font-size:11px">YOUR ON-CHAIN ARCHETYPE</div><h1>${S.players[0].dead?'你爆仓了':'你是'}<br/><span class="archetype">${S.players[0].dead?'先下桌的人':a}</span></h1><p>${S.players[0].dead?'这局不是输在最后一手，而是你失去了继续下注的资格。重新开局，看看能不能把下一手留住。':d}</p><div class="shareline">最终净值 <b>${money(nw(S.players[0]))}</b>，排名 #${rank.findIndex(p=>p.id===0)+1}。</div><div class="end-actions"><button class="primary" id="again">再开一局</button><button class="secondary" id="share">复制战绩</button></div></div></section></div>`}
function render(){app.innerHTML=!S?intro():S.gameover?end():`<div class="shell"><div class="topbar"><div class="brand"><div class="brandmark">◇</div><div><b>CHAIN TYCOON</b><span> 链上大亨</span></div></div><div class="top-actions"><button class="tinybtn" id="rules">规则</button><button class="tinybtn danger" id="restart">重开</button></div></div><div class="game-grid"><div class="board-wrap">${board()}</div>${side()}</div></div>`;bind();if(U.overlay)overlay(U.overlay)}
function bind(){document.querySelector('#new')?.addEventListener('click',start);document.querySelector('#continue')?.addEventListener('click',load);document.querySelector('#roll')?.addEventListener('click',roll);document.querySelector('#restart')?.addEventListener('click',()=>confirm('确定重开？')&&start());document.querySelector('#again')?.addEventListener('click',start);document.querySelector('#share')?.addEventListener('click',share);document.querySelector('#rules')?.addEventListener('click',rules)}
function overlay(h){let o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal">${h}</div>`;document.body.appendChild(o)}function close(){document.querySelector('.overlay')?.remove();U.overlay=null}
function rules(){U.overlay=`<div class="kicker">HOW TO PLAY</div><h2>链上大亨规则</h2><p>无人资产可买；别人落在你的资产上要付过路费；落在自己的资产上可加仓。集齐同板块全部资产，过路费 +50%。市场周期会改变估值和现金流。</p><div class="quote">现金不足时会自动折价卖资产；救不回来就爆仓出局。</div><button class="xbtn" id="ok">知道了</button>`;render();document.querySelector('#ok').onclick=()=>{close()}}
async function roll(){if(U.busy||S.turn!==0||S.players[0].dead||S.gameover)return;U.busy=true;U.dice=1+Math.floor(rnd()*6);render();await move(0,U.dice);await land(0);U.busy=false;if(!U.overlay)next()}
async function move(pid,n){let p=S.players[pid];for(let k=0;k<n;k++){p.pos=(p.pos+1)%24;if(!p.pos){p.cash+=20000;S.pot+=2000;log(`<strong>${p.name}</strong> 穿越 GENESIS，获得 ${money(20000)} 区块奖励。`)}render();await wait(90)}save()}
async function land(pid){let p=S.players[pid],i=p.pos,t=T[i];if(t.type==='asset')return asset(pid,i);return special(pid,t)}
function canBuy(p,a){let reserve=p.style==='whale'?36000:p.style==='quant'?42000:26000;if(p.cash-a.cost<reserve)return false;if(p.style==='whale')return a.sector==='CORE'||a.cost>34000||rnd()<.28;if(p.style==='quant')return a.rent/a.cost>.14||rnd()<.22;if(p.style==='diamond')return a.sector==='BETA'||a.vol>1.2||rnd()<.3;return true}
function buy(pid,i){let p=S.players[pid],a=A[T[i].asset];p.cash-=a.cost;S.owners[i]=pid;S.upgrades[i]=0;p.traits.system++;log(`<strong>${p.name}</strong> 买入 ${a.name}，成本 ${money(a.cost)}。`);solv(pid);save();render()}
function up(pid,i){let p=S.players[pid],a=A[T[i].asset],c=Math.round(a.cost*.52);p.cash-=c;S.upgrades[i]=(S.upgrades[i]||0)+1;log(`<strong>${p.name}</strong> 对 ${a.name} 加仓，等级 ${S.upgrades[i]+1}。`);solv(pid);save();render()}
function asset(pid,i){let p=S.players[pid],a=A[T[i].asset],o=S.owners[i];if(o===undefined){if(p.ai){if(canBuy(p,a))buy(pid,i);return}return new Promise(ok=>{U.overlay=`<div class="kicker">UNOWNED · ${a.sector}</div><h2>${a.sym} ${a.name}</h2><p>买下后，别人落在这里会向你付过路费。</p><div class="modal-stats"><div class="modal-stat"><small>成本</small><b>${money(a.cost)}</b></div><div class="modal-stat"><small>基础费</small><b>${money(a.rent)}</b></div><div class="modal-stat"><small>买后现金</small><b>${money(p.cash-a.cost)}</b></div></div><div class="modal-actions"><button class="choicebtn primary-choice" id="buy"><b>买入</b><span>拿资产，也牺牲现金选择权。</span></button><button class="choicebtn" id="pass"><b>跳过</b><span>保留火力。</span></button></div>`;render();document.querySelector('#buy').onclick=()=>{close();buy(0,i);S.players[0].traits.degen++;ok()};document.querySelector('#pass').onclick=()=>{S.players[0].traits.survive++;log('<strong>你</strong> 选择保留现金。');close();ok()}})}if(o===pid){if(p.ai){let c=Math.round(a.cost*.52);if((S.upgrades[i]||0)<2&&p.cash-c>26000&&rnd()<.55)up(pid,i);return}return new Promise(ok=>{let l=S.upgrades[i]||0,c=Math.round(a.cost*.52);U.overlay=`<div class="kicker">YOUR ASSET · LV ${l+1}</div><h2>${a.name}：继续加仓？</h2><p>更高现金流，也更集中。</p><div class="modal-actions"><button class="choicebtn primary-choice" id="up"><b>加仓 ${money(c)}</b><span>过路费继续提高。</span></button><button class="choicebtn" id="hold"><b>保持</b><span>把现金留给未来。</span></button></div>`;render();document.querySelector('#up').onclick=()=>{close();if(l<2&&p.cash>=c){up(0,i);S.players[0].traits.degen++}ok()};document.querySelector('#hold').onclick=()=>{S.players[0].traits.survive++;close();ok()}})}let fee=rent(i);S.players[pid].cash-=fee;S.players[o].cash+=fee;S.pot+=Math.round(fee*.03);log(`<strong>${p.name}</strong> 落在 ${S.players[o].name} 的 ${a.name}，支付 ${money(fee)}。`);solv(pid)}
function solv(pid){let p=S.players[pid];if(p.cash>=0)return;let hs=Object.entries(S.owners).filter(([,o])=>o===pid).map(([i])=>+i).sort((x,y)=>A[T[x].asset].cost-A[T[y].asset].cost);for(let i of hs){if(p.cash>=0)break;let a=A[T[i].asset],v=Math.round(a.cost*R[S.regime].mult*.58);p.cash+=v;delete S.owners[i];delete S.upgrades[i];log(`<strong>${p.name}</strong> 被迫卖出 ${a.name}，回笼 ${money(v)}。`)}if(p.cash<0){p.cash=0;p.dead=true;log(`<strong>${p.name}</strong> 现金链断裂，爆仓出局。`)}}
function special(pid,t){let p=S.players[pid];if(t.type==='event'&&!p.ai&&['rug','hack','whale','bridge'].includes(t.kind))return event();let d=0;if(t.kind==='airdrop')d=16000+Math.round(rnd()*18000);if(t.kind==='gas')d=-(7000+Math.round(rnd()*9000));if(t.kind==='liq')d=-Math.max(9000,Math.round(nw(p)*.1));if(t.kind==='etf')d=10000;if(t.kind==='halving'){d=8000;S.regime=rnd()<.55?'bull':'mania'}if(t.kind==='bull')S.regime='bull';if(t.kind==='bear')S.regime='bear';if(['rug','hack','whale','bridge'].includes(t.kind)&&p.ai){let e=E[Math.floor(rnd()*E.length)],c=e.choices[Math.floor(rnd()*2)];choice(p,c)}if(d){p.cash+=d;log(`<strong>${p.name}</strong> 在 ${t.name} ${d>0?'获得':'损失'} ${money(Math.abs(d))}。`);solv(pid)}save();render()}
function event(){return new Promise(ok=>{let e=E[Math.floor(rnd()*E.length)];U.overlay=`<div class="kicker">ON-CHAIN EVENT</div><h2>${e.title}</h2><div class="quote">${e.quote}</div><p>没有标准答案。你只能决定这次愿意拿什么换什么。</p><div class="modal-actions">${e.choices.map((c,i)=>`<button class="choicebtn" data-c="${i}"><b>${c.label}</b><span>${c.hint}</span></button>`).join('')}</div>`;render();document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let c=e.choices[+b.dataset.c];choice(S.players[0],c);log(`<strong>你</strong> 在「${e.title}」选择：${c.label}。`);close();ok()})})}
function choice(p,c){if(c.cash)p.cash+=c.cash;if(c.risk)p.cash+=c.risk[rnd()<.5?0:1];p.stress=Math.max(0,Math.min(100,p.stress+(c.stress||0)));p.traits[c.trait]=(p.traits[c.trait]||0)+2;solv(p.id);save()}
function shift(){let x=rnd(),cur=S.regime,n=cur;if(cur==='bull')n=x<.56?'bull':x<.78?'sideways':x<.93?'mania':'bear';else if(cur==='bear')n=x<.5?'bear':x<.73?'sideways':x<.88?'panic':'bull';else n=x<.34?'sideways':x<.61?'bull':x<.84?'bear':x<.93?'mania':'panic';S.regime=n;let v=S.history.at(-1)||100,dr={bull:.045,bear:-.04,mania:.075,panic:-.07,sideways:0}[n];S.history.push(Math.max(35,Math.min(220,v*(1+dr+(rnd()-.5)*.08))));log(`市场切换：<strong>${R[n].cn}</strong>。`)}
async function next(){if(S.gameover)return;if(S.players[0].dead)return finish();if(S.players.filter(p=>!p.dead).length<=1)return finish();let n=(S.turn+1)%4;if(!n){S.round++;if(S.round>12)return finish();shift()}S.turn=n;while(S.players[S.turn].dead)S.turn=(S.turn+1)%4;save();render();if(S.players[S.turn].ai){await wait(320);U.dice=1+Math.floor(rnd()*6);render();await move(S.turn,U.dice);await land(S.turn);await wait(180);next()}}
function finish(){if(S.gameover)return;S.gameover=true;save();render()}
async function share(){let r=[...S.players].sort((a,b)=>nw(b)-nw(a)),[a]=arche(),txt=`CHAIN TYCOON｜链上大亨\n净值：${money(nw(S.players[0]))}\n排名：#${r.findIndex(p=>p.id===0)+1}\n链上人格：${S.players[0].dead?'爆仓出局':a}`;try{await navigator.clipboard.writeText(txt);alert('战绩已复制')}catch(e){alert(txt)}}
window.render_game_to_text=()=>JSON.stringify({round:S?.round,turn:S?.turn,regime:S?.regime,gameover:S?.gameover,players:S?.players?.map(p=>({name:p.name,pos:p.pos,cash:p.cash,worth:nw(p),dead:p.dead})),owners:S?.owners});window.advanceTime=ms=>wait(ms);window.__chainTycoon={start,finish,getState:()=>S};render();
})();</script><script>(()=>{
  // Safety stop: once the human player is bankrupt, end the session instead of
  // allowing the autonomous bot turn chain to continue indefinitely.
  const timer=setInterval(()=>{
    const api=window.__chainTycoon;
    const s=api?.getState?.();
    if(!s||s.gameover)return;
    if(s.players?.[0]?.dead){
      s.players.slice(1).forEach(p=>p.dead=true);
      api.finish();
      clearInterval(timer);
    }
  },80);
})();
</script></body></html>
