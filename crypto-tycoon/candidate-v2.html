<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b1a" />
  <link rel="icon" href="data:," />
  <title>币圈大富翁 3D · Vertical Slice v2</title>
  <link rel="stylesheet" href="./candidate-v2.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game3d" aria-label="币圈大富翁 3D 实时场景"></canvas>
  <div class="vignette"></div>

  <section class="leaderboard" aria-label="玩家排行榜">
    <div class="hud-title">PORTFOLIO RANK</div>
    <div class="player me" data-rank="1"><span class="portrait astro">A</span><span class="identity"><b>YOU · 宇航员</b><small>¥120,000 CASH</small></span><strong>¥168,400</strong></div>
    <div class="player" data-rank="2"><span class="portrait dog">D</span><span class="identity"><b>DOGE WHALE</b><small>¥104,800 CASH</small></span><strong>¥154,900</strong></div>
    <div class="player" data-rank="3"><span class="portrait nft">N</span><span class="identity"><b>NFT QUANT</b><small>¥98,200 CASH</small></span><strong>¥147,600</strong></div>
    <div class="player" data-rank="4"><span class="portrait bull">B</span><span class="identity"><b>BULL HODLER</b><small>¥92,300 CASH</small></span><strong>¥139,100</strong></div>
  </section>

  <section class="round-card">
    <small>MARKET CYCLE</small>
    <div><b>ROUND 06</b><span>/ 12</span></div>
    <p><i></i> BULL · +18%</p>
    <em>GOAL · SURVIVE &amp; COMPOUND</em>
  </section>

  <section class="actions" aria-label="操作">
    <button aria-label="资产"><span>◆</span><small>ASSET</small></button>
    <button aria-label="卡牌"><span>♠</span><small>CARDS</small></button>
    <button aria-label="规则"><span>?</span><small>RULES</small></button>
  </section>

  <section class="ticker">
    <span class="live-dot"></span>
    <b>BTC +7.2%</b>
    <span>ETF FLOW ↑ · RISK ON · GAS -12%</span>
  </section>

  <button class="roll" aria-label="掷骰子">
    <span class="mini-die">⚄</span>
    <span><b>ROLL</b><small>掷骰子</small></span>
  </button>

  <script type="module" src="./candidate-v2-augment.js"></script>
</body>
</html>
