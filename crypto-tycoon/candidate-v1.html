<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b1a" />
  <title>币圈大富翁 3D · Vertical Slice</title>
  <link rel="stylesheet" href="./candidate-v1.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game3d" aria-label="币圈大富翁 3D 实时场景"></canvas>
  <div class="vignette"></div>

  <section class="hud leaderboard" aria-label="玩家排行榜">
    <div class="hud-title">PORTFOLIO RANK</div>
    <div class="player me"><span class="portrait astro">A</span><span class="identity"><b>YOU · 宇航员</b><small>现金 ¥120,000</small></span><strong>¥168,400</strong></div>
    <div class="player"><span class="portrait dog">D</span><span class="identity"><b>巨鲸</b><small>现金 ¥104,800</small></span><strong>¥154,900</strong></div>
    <div class="player"><span class="portrait nft">N</span><span class="identity"><b>量化</b><small>现金 ¥98,200</small></span><strong>¥147,600</strong></div>
    <div class="player"><span class="portrait bull">B</span><span class="identity"><b>钻石手</b><small>现金 ¥92,300</small></span><strong>¥139,100</strong></div>
  </section>

  <section class="hud round-card">
    <small>MARKET CYCLE</small>
    <div><b>ROUND 06</b><span>/ 12</span></div>
    <p><i></i> BULL · +18%</p>
  </section>

  <section class="hud actions" aria-label="操作">
    <button>资产</button>
    <button>卡牌</button>
    <button>规则</button>
  </section>

  <section class="ticker">
    <span class="live-dot"></span>
    <b>BTC +7.2%</b>
    <span>ETF 资金流入 · 科技板块风险偏好回升 · Gas -12%</span>
  </section>

  <button class="roll" aria-label="掷骰子">
    <span class="mini-die">⚄</span>
    <span><b>ROLL</b><small>掷骰子</small></span>
  </button>

  <div class="slice-badge">TRUE 3D · VERTICAL SLICE</div>

  <script type="module" src="./candidate-v1.js"></script>
</body>
</html>
