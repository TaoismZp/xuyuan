<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#070914"/>
<title>币圈大富翁 3D</title>
<link rel="stylesheet" href="styles.css"/>
<style>
:root{--gold:#ffd66b;--gold2:#e99b1f;--deep:#070914;--deep2:#0c1022;--neon:#55d8ff;--purple:#9a72ff}
html,body{background:radial-gradient(circle at 50% -20%,#273568 0,transparent 34%),radial-gradient(circle at 100% 20%,#2a1760 0,transparent 28%),linear-gradient(180deg,#070914,#04060d 72%);min-height:100%;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(85,216,255,.02) 80px),repeating-linear-gradient(0deg,transparent 0 79px,rgba(85,216,255,.016) 80px);mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 70%)}
.shell{width:min(1360px,100%)}
.topbar{position:relative;z-index:5}.brandmark{background:linear-gradient(145deg,#ffdd76,#e99c1d);color:#3a2100;border:1px solid #ffe5a2;box-shadow:0 8px 28px rgba(255,190,60,.22)}.brandmark:before{content:"₿"}.brandmark{font-size:0}.brandmark:before{font-size:17px;font-weight:1000}.brand b{font-size:19px}.brand span{color:#8898c6}
.game-grid{grid-template-columns:minmax(0,1fr) 338px;gap:20px}.board-wrap{perspective:1500px;perspective-origin:50% 44%;padding:24px 10px 48px;position:sticky;top:0}.board{overflow:visible;transform-style:preserve-3d;transform:rotateX(48deg) rotateZ(-4deg) scale(.97);transform-origin:50% 50%;border:2px solid rgba(255,214,107,.74);background:linear-gradient(145deg,#111936,#080d1d);box-shadow:0 36px 0 #080b18,0 50px 34px rgba(0,0,0,.56),0 0 80px rgba(95,75,255,.2);border-radius:28px}
.board:before{content:"";position:absolute;inset:-2px;border-radius:28px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 28px rgba(255,201,82,.13)}
.board:after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;background:linear-gradient(130deg,rgba(255,255,255,.05),transparent 24%,transparent 72%,rgba(85,216,255,.04))}
.tile{overflow:visible;transform:translateZ(16px);transform-style:preserve-3d;border-color:rgba(255,255,255,.08);background:linear-gradient(180deg,#1b2443,#10152a);box-shadow:0 8px 0 rgba(3,5,13,.84),inset 0 1px 0 rgba(255,255,255,.045);transition:filter .18s,transform .18s}.tile.asset{background:linear-gradient(180deg,#1d294d,#11172e)}.tile.special{background:linear-gradient(180deg,#34214d,#18142b)}.tile.event{background:linear-gradient(180deg,#3b2a25,#19162a)}.tile.you-here{box-shadow:0 8px 0 rgba(3,5,13,.84),inset 0 0 0 2px #ffe17b,0 0 24px rgba(255,211,91,.28);filter:brightness(1.18)}
.tile .sym{font-size:clamp(16px,2vw,28px);text-shadow:0 5px 10px rgba(0,0,0,.44)}.tile .name{font-size:clamp(7px,.9vw,10px);letter-spacing:.01em}.tile .meta{color:#8a97bc}.tile.owned .ownerline{height:4px;box-shadow:0 0 10px var(--owner)}
.token{width:clamp(14px,1.7vw,22px);height:clamp(14px,1.7vw,22px);font-size:clamp(6px,.8vw,9px);transform:translateZ(30px) scale(1.25);box-shadow:0 7px 9px rgba(0,0,0,.55),0 0 14px currentColor;border:2px solid rgba(255,255,255,.64)}
.board-center{overflow:visible;transform:translateZ(7px);border-radius:20px;background:radial-gradient(circle at 50% 45%,rgba(51,91,182,.46),rgba(12,17,40,.95) 56%,#090d1d 78%);border:1px solid rgba(92,164,255,.24);box-shadow:inset 0 0 50px rgba(71,135,255,.07)}
.board-center:before{content:"";position:absolute;left:14%;right:14%;top:22%;bottom:22%;border-radius:50%;border:1px solid rgba(85,216,255,.22);box-shadow:0 0 34px rgba(85,216,255,.12),inset 0 0 34px rgba(85,216,255,.08);background:repeating-conic-gradient(from 0deg,rgba(85,216,255,.11) 0 2deg,transparent 2deg 15deg);animation:orbit 18s linear infinite}.board-center .market-top,.board-center .market-chart,.board-center .center-bottom{position:relative;z-index:4}.market-regime{font-size:clamp(28px,5vw,58px);text-shadow:0 7px 18px rgba(0,0,0,.48)}.fear{background:rgba(5,8,20,.54);backdrop-filter:blur(8px);border-color:rgba(255,255,255,.12)}.market-chart{opacity:.48;filter:drop-shadow(0 0 6px rgba(80,240,164,.25))}
.title3d{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%) translateZ(34px);white-space:nowrap;font-size:clamp(24px,4.8vw,58px);font-weight:1000;letter-spacing:-.07em;color:#ffd66b;text-shadow:0 4px 0 #7f4200,0 0 30px rgba(255,196,62,.5)}.title3d small{display:block;font-size:clamp(6px,.85vw,10px);letter-spacing:.2em;color:#9adfff;text-align:center;text-shadow:none;margin-top:6px}.landmarks3d{position:absolute;z-index:6;inset:0;pointer-events:none}.landmarks3d span{position:absolute;font-size:clamp(20px,3.6vw,46px);filter:drop-shadow(0 10px 10px rgba(0,0,0,.45));transform:translateZ(42px)}.landmarks3d .bull{left:17%;top:20%}.landmarks3d .rocket{right:18%;top:18%}.landmarks3d .whale{right:17%;bottom:19%}.landmarks3d .bear{left:17%;bottom:19%}
.rollbtn{border:1px solid #ffe69b;background:linear-gradient(180deg,#ffdf78,#e99b1f);color:#3a2100;font-size:17px;letter-spacing:.02em;box-shadow:0 9px 0 #7c4700,0 17px 28px rgba(0,0,0,.36),0 0 25px rgba(255,195,57,.18);border-radius:18px}.rollbtn:not([disabled]):active{transform:translateY(4px);box-shadow:0 5px 0 #7c4700,0 10px 18px rgba(0,0,0,.38)}.die{background:#fff;color:#151515;box-shadow:inset 0 -3px 0 #c7c7c7}
.panel{background:linear-gradient(180deg,rgba(24,31,61,.96),rgba(11,15,31,.96));border-color:rgba(255,255,255,.09);box-shadow:0 14px 36px rgba(0,0,0,.18)}.turn-card{border-color:rgba(255,208,92,.25)}.player{padding:10px 0}.dot{box-shadow:0 0 10px currentColor}.port{background:rgba(255,255,255,.025)}.sector-tag.complete{background:linear-gradient(180deg,#63f5b2,#3ac98c);box-shadow:0 0 14px rgba(80,240,164,.18)}
.overlay{background:rgba(2,4,11,.78)}.modal{background:linear-gradient(180deg,#1d2547,#0b1023 72%);border-color:rgba(255,255,255,.14)}.choicebtn.primary-choice{border-color:#4e9470;background:#123027}.primary{background:linear-gradient(180deg,#ffdc73,#e9a21e);color:#392100;box-shadow:0 10px 28px rgba(255,191,51,.16)}
.intro{position:relative}.intro h1 em{color:#ffd66b;text-shadow:0 0 30px rgba(255,204,86,.22)}.preview-card{transform:perspective(900px) rotateY(-8deg) rotateX(4deg);background:linear-gradient(160deg,#1b2448,#0d1228 70%);border-color:rgba(255,214,107,.24);box-shadow:0 32px 70px rgba(0,0,0,.45)}
.preview-card:after{content:"🎲  ₿  🚀  🐋";position:absolute;left:18px;right:18px;bottom:16px;text-align:center;font-size:26px;letter-spacing:.35em;opacity:.74;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(max-width:900px){.game-grid{grid-template-columns:1fr}.board-wrap{position:static;padding:16px 5px 38px}.board{transform:rotateX(43deg) rotateZ(-3deg) scale(.95)}.side{grid-template-columns:1fr 1fr}.turn-card{grid-column:1/-1}}
@media(max-width:620px){.board-wrap{padding:4px 0 20px;perspective:1100px}.board{transform:rotateX(34deg) rotateZ(-2deg) scale(.96);box-shadow:0 22px 0 #080b18,0 30px 28px rgba(0,0,0,.5),0 0 42px rgba(95,75,255,.15);border-radius:18px}.tile{transform:translateZ(8px);box-shadow:0 5px 0 rgba(3,5,13,.84)}.title3d{font-size:24px;top:49%}.title3d small{font-size:6px}.landmarks3d span{font-size:20px}.side{grid-template-columns:1fr}.preview-card{transform:none}.token{transform:translateZ(18px) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.board-center:before{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="fix.js"></script>
<script>
(()=>{
  function decorate(){
    const c=document.querySelector('.board-center');
    if(c&&!c.querySelector('.title3d')){
      const t=document.createElement('div');t.className='title3d';t.innerHTML='币圈大富翁<small>CRYPTO TYCOON · SURVIVE THE CYCLE</small>';c.appendChild(t);
      const l=document.createElement('div');l.className='landmarks3d';l.innerHTML='<span class="bull">🐂</span><span class="rocket">🚀</span><span class="whale">🐋</span><span class="bear">🐻</span>';c.appendChild(l);
    }
    const b=document.querySelector('.brand b');if(b)b.textContent='币圈大富翁 3D';
    const s=document.querySelector('.brand span');if(s)s.textContent=' CRYPTO TYCOON';
  }
  decorate();
  new MutationObserver(decorate).observe(document.getElementById('app'),{childList:true,subtree:true});
})();
</script>
</body>
</html>
