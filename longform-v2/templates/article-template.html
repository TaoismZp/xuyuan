<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} · TaoismZp / 长文</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="article">
  <div class="reading-progress" aria-hidden="true"></div>
  <header class="masthead shell">
    <a class="brand" href="../"><span>TaoismZp</span><em>/ 长文</em></a>
    <nav aria-label="主导航"><a href="../#archive">文章</a><a href="../about.html">关于</a><a class="owner-link" href="../write.html">写作台</a></nav>
  </header>
  <main class="article-shell">
    <header class="article-header">
      <p class="eyebrow">{{DATE_DISPLAY}} · {{READING_TIME}}</p>
      <h1>{{TITLE}}</h1>
      <p class="article-deck">{{DECK}}</p>
      <p class="meta">{{TAGS}}</p>
    </header>
    <article class="prose">{{BODY}}</article>
    <footer class="article-end">
      <p class="eyebrow">Published {{DATE_DISPLAY}} · TaoismZp</p>
      <div class="article-actions"><button class="quiet-button" type="button" data-share>分享文章</button><button class="quiet-button" type="button" data-copy-link>复制链接</button><a class="quiet-button" href="../#archive">返回全部文章</a></div>
    </footer>
  </main>
  <footer class="footer shell"><p>© <span id="year">2026</span> TaoismZp</p><p>文字是主体，网页只是纸张。</p></footer>
  <script src="../app.js" defer></script>
</body>
</html>
