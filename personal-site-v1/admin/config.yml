# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: TaoismZp/xuyuan
  branch: main
  root_dir: personal-site-v1
  auth_methods: [token]
  commit_messages:
    create: 'Publish content: {{path}}'
    update: 'Update content: {{path}}'
    delete: 'Delete content: {{path}}'
    uploadMedia: 'Upload media: {{path}}'
    deleteMedia: 'Delete media: {{path}}'

media_folder: media/uploads
public_folder: /xuyuan/personal-site-v1/media/uploads

collections:
  - name: posts
    label: 长文
    label_singular: 长文
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} · {{date}}'
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: summary, widget: text, hint: '用于首页、文章列表和搜索描述。' }
      - { label: 发布日期, name: date, widget: datetime, type: date, default: '{{now}}' }
      - { label: 标签, name: tags, widget: list, required: false }
      - label: 发布状态（不控制 GitHub 源码可见性）
        name: status
        widget: select
        hint: '注意：GitHub 仓库公开。草稿只是不会出现在网站上；保存到 GitHub 的原文仍对所有人可见。请不要在这里保存私密草稿。'
        options:
          - { label: 草稿（GitHub 仍公开）, value: draft }
          - { label: 已发布, value: published }
          - { label: 已归档, value: archived }
        default: draft
      - { label: 首页重点, name: featured, widget: boolean, default: false, required: false }
      - { label: 正文, name: body, widget: richtext }
