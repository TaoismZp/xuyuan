name: 发布一篇长文
description: 用 GitHub 身份安全发布到 TaoismZp / 长文
title: "[长文] "
labels: ["publish-longform"]
body:
  - type: markdown
    attributes:
      value: |
        提交后，仓库会自动生成文章页、更新首页并重新部署。正文使用 Markdown。
  - type: input
    id: deck
    attributes:
      label: 副标题
      description: 用一两句话告诉读者为什么值得读。
      placeholder: 这篇文章真正想解决的问题是……
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签（逗号分隔）
      placeholder: 交易，认知，长期主义
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: 正文
      description: 支持二/三级标题、引用、列表、链接、代码与分隔线。
      placeholder: |
        从这里开始写正文。

        ## 第一节

        ……
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 发布确认
      options:
        - label: 我确认这是要公开发布的正文。
          required: true
