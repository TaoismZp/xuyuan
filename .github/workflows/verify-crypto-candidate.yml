name: Supervise Crypto Tycoon Candidate
# v7.6 construction supervision; controlling blueprint: crypto-tycoon/BUILD_BLUEPRINT_V5.md

on:
  push:
    branches: [main]
    paths:
      - 'wish-delivery/versions/v7.6.md'
      - 'crypto-tycoon/BUILD_BLUEPRINT_V5.md'
      - 'crypto-tycoon/candidate-v1.js'
      - 'crypto-tycoon/candidate-v2.css'
      - 'crypto-tycoon/candidate-v2-augment.js'
      - 'crypto-tycoon/candidate-v3-augment.js'
      - 'crypto-tycoon/candidate-v4.html'
      - 'crypto-tycoon/candidate-v4-augment.js'
      - 'crypto-tycoon/candidate-v5.css'
      - 'crypto-tycoon/candidate-v5.html'
      - 'crypto-tycoon/candidate-v5-augment.js'
      - 'crypto-tycoon/candidate-v6.html'
      - 'crypto-tycoon/candidate-v6-augment.js'
      - 'crypto-tycoon/candidate-v7.html'
      - 'crypto-tycoon/candidate-v7-augment.js'
      - 'crypto-tycoon/candidate-v8.css'
      - 'crypto-tycoon/candidate-v8.html'
      - 'crypto-tycoon/candidate-v8-augment.js'
      - 'crypto-tycoon/candidate-v9.html'
      - 'crypto-tycoon/candidate-v9-augment.js'
      - 'tests/crypto-candidate-visual.js'
      - '.github/workflows/verify-crypto-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify controlling blueprint and protocol identity
        run: |
          test -f wish-delivery/versions/v7.6.md
          test -f crypto-tycoon/BUILD_BLUEPRINT_V5.md
          test -f crypto-tycoon/PROJECT_STATE.md
          grep -q 'wish-delivery/versions/v7.6.md' crypto-tycoon/BUILD_BLUEPRINT_V5.md
          echo "PROTOCOL_SHA=$(git hash-object wish-delivery/versions/v7.6.md)"
          echo "BLUEPRINT_SHA=$(git hash-object crypto-tycoon/BUILD_BLUEPRINT_V5.md)"
          echo "STATE_SHA=$(git hash-object crypto-tycoon/PROJECT_STATE.md)"
          echo "CANDIDATE_COMMIT=$GITHUB_SHA"
      - name: Install CJK supervision fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          fc-cache -f
      - name: Install supervision clients
        run: |
          npm init -y
          npm install --save-dev playwright pngjs
      - name: Start candidate server
        run: |
          python3 -m http.server 8080 >/tmp/crypto-candidate-http.log 2>&1 &
          echo $! > /tmp/crypto-candidate-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8080/crypto-tycoon/candidate-v9.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/crypto-candidate-http.log
          exit 1
      - name: Capture same-commit vertical slice
        env:
          TARGET_URL: http://127.0.0.1:8080/crypto-tycoon/candidate-v9.html?test=1
          EXPECTED_VERSION: candidate-v9
          PW_CHANNEL: chrome
        run: node tests/crypto-candidate-visual.js
      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-candidate-supervisor-evidence-v9
          path: artifacts/*
          if-no-files-found: warn
