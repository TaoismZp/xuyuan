name: Verify Crypto Tycoon Game Feel v12

on:
  push:
    paths:
      - 'crypto-tycoon/candidate-v12.html'
      - 'crypto-tycoon/candidate-v12-feel.js'
      - 'crypto-tycoon/candidate-v12-feel.css'
      - 'crypto-tycoon/BUILD_BLUEPRINT_V6.md'
      - 'crypto-tycoon/GAME_FEEL_BENCHMARK.md'
      - 'tests/crypto-feel-v12.js'
      - '.github/workflows/verify-crypto-feel-v12.yml'
  workflow_dispatch:

jobs:
  feel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/crypto-v12-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/crypto-tycoon/candidate-v12.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/crypto-v12-http.log
          exit 1
      - name: Verify game-feel vertical slice
        env:
          TARGET_URL: http://127.0.0.1:8080/crypto-tycoon/candidate-v12.html?test=1
        run: node tests/crypto-feel-v12.js
      - name: Upload feel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-feel-v12-evidence
          path: artifacts/*.json
          if-no-files-found: warn
