name: Verify Crypto Tycoon Public Smoke
on:
  push:
    branches: [main]
    paths:
      - 'crypto-tycoon/**'
      - 'tests/crypto-public-smoke.js'
      - '.github/workflows/verify-crypto-public-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Verify real GitHub Pages play entry and capture visual evidence
        run: TARGET_URL="https://taoismzp.github.io/xuyuan/crypto-tycoon/?test=1" node tests/crypto-public-smoke.js
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-public-visual-evidence
          path: artifacts/*.png
          if-no-files-found: warn
