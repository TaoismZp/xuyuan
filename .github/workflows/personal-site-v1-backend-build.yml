name: Verify personal site v1 backend integration
on:
  push:
    branches: [personal-site-v1-frontend, personal-site-v1-public-hardening, personal-site-v1-distribution-metadata, personal-site-v1-reader-flow]
    paths:
      - 'personal-site-v1/**'
      - '.github/workflows/personal-site-v1-backend-build.yml'
      - '.github/workflows/personal-site-v1-supervision.yml'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install static builder dependencies
        run: npm install --prefix personal-site-v1 --no-audit --no-fund
      - name: Create ephemeral content fixtures
        run: |
          mkdir -p personal-site-v1/content/posts
          cat > personal-site-v1/content/posts/ci-published.md <<'POST'
          ---
          title: "等待：交易中最稀缺的能力"
          summary: "一篇用于验证后台到前台生成闭环的中文长文样稿。"
          date: "2026-11-03"
          tags: ["交易", "纪律"]
          status: published
          featured: true
          ---

          交易的大部分时间并不发生在买入和卖出。

          ## 等待不是空白

          真正困难的部分，是在没有动作的时候仍然保持判断。

          > 等待本身，就是交易系统的一部分。
          POST
          cat > personal-site-v1/content/posts/ci-draft.md <<'POST'
          ---
          title: "不应公开的草稿"
          summary: "这篇只用于验证草稿不会进入前台。"
          date: "2026-11-03"
          tags: ["测试"]
          status: draft
          ---

          这段内容不能出现在公开页面。
          POST
      - name: Build public pages from Markdown
        run: node personal-site-v1/scripts/build.mjs
      - name: Construction integrity checks
        run: |
          test -f personal-site-v1/essays/ci-published/index.html
          grep -q '等待：交易中最稀缺的能力' personal-site-v1/index.html
          grep -q '等待：交易中最稀缺的能力' personal-site-v1/essays/index.html
          grep -q '等待不是空白' personal-site-v1/essays/ci-published/index.html
          grep -q 'id="section-01"' personal-site-v1/essays/ci-published/index.html
          grep -q 'href="#section-01"' personal-site-v1/essays/ci-published/index.html
          grep -q 'class="article-outline-mobile"' personal-site-v1/essays/ci-published/index.html
          grep -q 'class="article-outline-desktop"' personal-site-v1/essays/ci-published/index.html
          grep -q 'class="article-end"' personal-site-v1/essays/ci-published/index.html
          ! grep -q '阅读模式' personal-site-v1/essays/ci-published/index.html
          ! grep -R '不应公开的草稿' personal-site-v1/index.html personal-site-v1/essays/index.html personal-site-v1/essays/ci-published/index.html
          grep -q 'auth_methods: \[token\]' personal-site-v1/admin/config.yml
          ! grep -R -E 'github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+' personal-site-v1/admin personal-site-v1/content
      - name: Verify public deployment excludes unpublished Markdown
        run: |
          node personal-site-v1/scripts/assemble-pages.mjs "$RUNNER_TEMP/pages-publish"
          node personal-site-v1/scripts/verify-pages-artifact.mjs "$RUNNER_TEMP/pages-publish"
          test -f "$RUNNER_TEMP/pages-publish/personal-site-v1/essays/ci-published/index.html"
          grep -q '等待：交易中最稀缺的能力' "$RUNNER_TEMP/pages-publish/personal-site-v1/essays/ci-published/index.html"
          ! grep -R '不应公开的草稿' "$RUNNER_TEMP/pages-publish/personal-site-v1"
          grep -q '等待：交易中最稀缺的能力' "$RUNNER_TEMP/pages-publish/personal-site-v1/feed.xml"
          grep -q 'ci-published' "$RUNNER_TEMP/pages-publish/personal-site-v1/sitemap.xml"
          ! grep -q 'ci-draft' "$RUNNER_TEMP/pages-publish/personal-site-v1/sitemap.xml"
          ! grep -q '不应公开的草稿' "$RUNNER_TEMP/pages-publish/personal-site-v1/feed.xml"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET,os
          base=os.environ["RUNNER_TEMP"]+"/pages-publish/personal-site-v1/"
          for f in ["feed.xml","sitemap.xml"]: ET.parse(base+f)
          PY
      - name: Install browser verifier and CJK fonts
        run: |
          npm i playwright@1.56.1 --no-save
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Serve actual packaged delivery surface
        run: |
          cd "$RUNNER_TEMP/pages-publish"
          python3 -m http.server 4175 >/tmp/personal-site-backend.log 2>&1 &
          sleep 2
      - name: Verify generated public surface and admin entry
        run: |
          node personal-site-v1/scripts/verify-public-content.mjs http://127.0.0.1:4175/personal-site-v1/
          mkdir -p personal-site-v1/backend-evidence
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [surface,w,h,mobile] of [['desktop',1440,1000,false],['mobile',390,844,true]]){
              for(const [name,path] of [['home','personal-site-v1/'],['archive','personal-site-v1/essays/'],['article','personal-site-v1/essays/ci-published/']]){
                const p=await browser.newPage({viewport:{width:w,height:h},isMobile:mobile,hasTouch:mobile,deviceScaleFactor:mobile?2:1});
                await p.goto(`http://127.0.0.1:4175/${path}`,{waitUntil:'networkidle'});
                const data=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,h1:document.querySelector('h1')?.innerText||'',text:document.body.innerText}));
                assert(!data.overflow,`${name}/${surface}: horizontal overflow`);
                assert(data.text.includes('等待：交易中最稀缺的能力'),`${name}/${surface}: generated post missing`);
                assert(!data.text.includes('不应公开的草稿'),`${name}/${surface}: draft leaked`);
                if(name==='article'){
                  const headCount=await p.locator('.article-body h2[id]').count();
                  assert(headCount>=1,'generated article h2 anchors missing');
                  assert(await p.locator('.article-end a[href="../"]').count()===1,'return-to-archive missing');
                  if(mobile){
                    const size=await p.locator('.article-body').evaluate(el=>parseFloat(getComputedStyle(el).fontSize));
                    assert(size>=18,'mobile article text below 18px');
                    const summary=p.locator('.article-outline-mobile summary');
                    assert(await summary.count()===1,'mobile section disclosure missing');
                    const box=await summary.boundingBox();
                    assert(box&&box.height>=44,'mobile section control is too small');
                    await summary.click();
                    assert(await p.locator('.article-outline-mobile').evaluate(el=>el.open),'mobile outline did not open');
                    await p.locator('.article-outline-mobile [data-outline-link]').first().click();
                    assert(p.url().endsWith('#section-01'),'mobile section link did not navigate');
                    assert(!(await p.locator('.article-outline-mobile').evaluate(el=>el.open)),'mobile outline stayed open after jump');
                  } else {
                    assert(await p.locator('.article-outline-desktop [data-outline-link]').count()===headCount,'desktop outline count mismatch');
                    await p.locator('.article-outline-desktop [data-outline-link]').first().click();
                    assert(p.url().endsWith('#section-01'),'desktop section link did not navigate');
                  }
                  assert(!(await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)),'article overflows after section navigation');
                }
                await p.screenshot({path:`personal-site-v1/backend-evidence/${name}-${surface}.png`,fullPage:true});
                await p.close();
              }
            }
            const admin=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            await admin.goto('http://127.0.0.1:4175/personal-site-v1/admin/',{waitUntil:'domcontentloaded'});
            await admin.waitForTimeout(5000);
            const adminText=(await admin.locator('body').innerText()).trim();
            assert(adminText.length>10,'production admin is blank');
            const overflow=await admin.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
            assert(!overflow,'production admin entry overflows mobile viewport');
            await admin.screenshot({path:'personal-site-v1/backend-evidence/admin-mobile.png',fullPage:true});
            await admin.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: personal-site-v1-backend-evidence-${{ github.run_id }}
          path: personal-site-v1/backend-evidence/*.png
          retention-days: 7
