name: Compare personal site CMS candidates
on:
  push:
    branches: [personal-site-v1-frontend]
    paths:
      - 'personal-site-v1/backend-spikes/**'
      - '.github/workflows/personal-site-v1-backend-spikes.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.56.1
          npx playwright install chromium
      - name: Serve spike pages
        run: |
          python3 -m http.server 4180 >/tmp/cms-spikes.log 2>&1 &
          sleep 2
      - name: Inspect candidate new-entry editors
        run: |
          mkdir -p personal-site-v1/backend-spikes/evidence
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const candidate of ['sveltia','decap']){
              const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
              const base=`http://127.0.0.1:4180/personal-site-v1/backend-spikes/${candidate}/`;
              await p.goto(base,{waitUntil:'domcontentloaded'});
              await p.waitForTimeout(7000);
              if(candidate==='sveltia'){
                const b=p.getByRole('button',{name:/Work with Test Repository/i});
                if(await b.count()) { await b.click(); await p.waitForTimeout(2500); }
              }
              await p.goto(`${base}#/collections/posts/new`,{waitUntil:'domcontentloaded'});
              await p.waitForTimeout(3500);
              const controls=await p.evaluate(()=>[...document.querySelectorAll('input,textarea,[contenteditable="true"],button,select')].map((el,i)=>({
                i, tag:el.tagName, type:el.getAttribute('type'), name:el.getAttribute('name'), id:el.id,
                aria:el.getAttribute('aria-label'), placeholder:el.getAttribute('placeholder'),
                text:(el.innerText||el.value||'').slice(0,120), contenteditable:el.getAttribute('contenteditable')
              })).slice(0,120));
              const labels=await p.locator('label').allTextContents();
              const body=(await p.locator('body').innerText()).trim();
              results.push({candidate,body:body.slice(0,4000),labels,controls,url:p.url(),overflow:await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)});
              await p.screenshot({path:`personal-site-v1/backend-spikes/evidence/${candidate}-new-entry-mobile.png`,fullPage:true});
              await p.close();
            }
            fs.writeFileSync('personal-site-v1/backend-spikes/evidence/editor-results.json',JSON.stringify(results,null,2));
            await browser.close();
          })();
          NODE
      - name: Assert editor routes opened
        run: |
          node <<'NODE'
          const r=require('./personal-site-v1/backend-spikes/evidence/editor-results.json');
          for(const x of r){
            if(!/标题|Title/i.test(x.body)) throw new Error(`${x.candidate}: title field not visible`);
            if(!/正文|Body/i.test(x.body)) throw new Error(`${x.candidate}: body field not visible`);
          }
          NODE
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: personal-site-v1-backend-spikes-${{ github.run_id }}
          path: personal-site-v1/backend-spikes/evidence/*
          retention-days: 7
