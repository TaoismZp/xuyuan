name: Compare personal site CMS candidates
on:
  push:
    branches: [personal-site-v1-frontend]
    paths:
      - 'personal-site-v1/backend-spikes/**'
      - '.github/workflows/personal-site-v1-backend-spikes.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.56.1
          npx playwright install chromium
      - name: Serve spike pages
        run: |
          python3 -m http.server 4180 >/tmp/cms-spikes.log 2>&1 &
          sleep 2
      - name: Inspect candidate content-library states
        run: |
          mkdir -p personal-site-v1/backend-spikes/evidence
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const candidate of ['sveltia','decap']){
              const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
              const consoleMessages=[];
              const pageErrors=[];
              p.on('console',m=>consoleMessages.push(`${m.type()}: ${m.text()}`));
              p.on('pageerror',e=>pageErrors.push(String(e)));
              await p.goto(`http://127.0.0.1:4180/personal-site-v1/backend-spikes/${candidate}/`,{waitUntil:'domcontentloaded'});
              await p.waitForTimeout(7000);
              const entryBody=(await p.locator('body').innerText()).trim();
              await p.screenshot({path:`personal-site-v1/backend-spikes/evidence/${candidate}-entry-mobile.png`,fullPage:true});
              if(candidate==='sveltia'){
                const testButton=p.getByRole('button',{name:/Work with Test Repository/i});
                if(await testButton.count()) { await testButton.click(); await p.waitForTimeout(3500); }
              }
              const libraryBody=(await p.locator('body').innerText()).trim();
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
              results.push({
                candidate,
                entryBody:entryBody.slice(0,1000),
                libraryBody:libraryBody.slice(0,2600),
                overflow,
                buttons:await p.getByRole('button').allTextContents(),
                links:await p.getByRole('link').allTextContents(),
                consoleMessages:consoleMessages.slice(-30),
                pageErrors:pageErrors.slice(-20)
              });
              await p.screenshot({path:`personal-site-v1/backend-spikes/evidence/${candidate}-library-mobile.png`,fullPage:true});
              await p.close();
            }
            fs.writeFileSync('personal-site-v1/backend-spikes/evidence/results.json',JSON.stringify(results,null,2));
            await browser.close();
          })();
          NODE
      - name: Assert both candidates reached usable UI
        run: |
          node <<'NODE'
          const r=require('./personal-site-v1/backend-spikes/evidence/results.json');
          for(const x of r){
            if(x.libraryBody.length<20) throw new Error(`${x.candidate}: blank after initialization`);
            if(!/长文|posts/i.test(x.libraryBody)) throw new Error(`${x.candidate}: collection not visible after initialization`);
          }
          NODE
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: personal-site-v1-backend-spikes-${{ github.run_id }}
          path: personal-site-v1/backend-spikes/evidence/*
          retention-days: 7
