name: Publish longform article

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-longform
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[发文]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish article from issue
        id: publish
        run: |
          slug=$(python essays/publish.py)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Commit article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essays/posts
          git commit -m "Publish article: ${{ steps.publish.outputs.slug }}"
          git push
      - name: Close publishing issue
        uses: actions/github-script@v8
        with:
          script: |
            const slug = '${{ steps.publish.outputs.slug }}';
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/essays/article.html?slug=${encodeURIComponent(slug)}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`已发布：${url}`});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
