name: Publish longform article

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-longform
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == 'TaoismZp' &&
      startsWith(github.event.issue.title, '[长文]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Render article from issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 longform-v2/scripts/publish_issue.py
      - name: Verify generated site
        run: python3 longform-v2/tests/verify_static.py
      - name: Commit publication
        run: |
          git config user.name "longform-publisher[bot]"
          git config user.email "longform-publisher[bot]@users.noreply.github.com"
          git add longform-v2
          if ! git diff --cached --quiet; then
            git commit -m "Publish longform #${{ github.event.issue.number }}"
            git push origin main
          fi
      - name: Confirm publication request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTICLE_URL: https://taoismzp.github.io/xuyuan/longform-v2/posts/p-${{ github.event.issue.number }}.html
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "已进入发布部署：$ARTICLE_URL"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
