name: E18 actual-file engineering regressions
on:
  push:
    branches: [experiment/deepwrite-e18-closure-runner-20261111]
    paths:
      - 'deepwrite/candidates/e15-review-closure/**'
      - 'deepwrite/candidates/e18-writing-loop/**'
      - 'deepwrite/tools/**'
      - 'deepwrite/qa/**'
      - '.github/workflows/e18-guard-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-file-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Reproduce old false passes and verify repaired real-file checks
        run: python3 -B -m unittest discover -s deepwrite/candidates/e15-review-closure -p 'test_*.py' -v
      - name: Exercise writing, actual revisions, packaging and restore with explicit fixtures
        run: python3 -B -m unittest discover -s deepwrite/tools/tests -p 'test_writing_loop_experimental.py' -v
      - name: Export actual engineering fixture files and checkpoint
        run: python3 -B deepwrite/tools/tests/test_writing_loop_experimental.py --fixture-output "$RUNNER_TEMP/e18-engineering/project"
      - name: Preserve explicit fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e18-engineering-fixture-not-live-model
          path: ${{ runner.temp }}/e18-engineering
          retention-days: 30
