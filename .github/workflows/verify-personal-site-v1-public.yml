name: Verify personal site v1 public surface
on:
  workflow_run:
    workflows: ["Deploy playable artifacts to GitHub Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify-public:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Bind verification to delivery identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          echo "delivery_identity=${{ github.event.workflow_run.head_sha }}"
      - name: Public HTTP verification
        id: http
        continue-on-error: true
        run: |
          set -euo pipefail
          base="https://taoismzp.github.io/xuyuan/personal-site-v1"
          for path in "/" "/essays/" "/projects/" "/about/" "/admin/" "/write/" "/admin/config.yml" "/assets/write.js" "/assets/write.css" "/assets/markdown-it.min.js" "/assets/markdown-it.LICENSE.txt" "/assets/site.css" "/assets/site.js" "/assets/content.css"; do
            curl --fail --silent --show-error --retry 8 --retry-delay 4 "$base$path" >/tmp/public-check
            test -s /tmp/public-check
          done
          curl --fail --silent --retry 8 --retry-delay 4 "$base/" | grep -q "长期交易"
          node personal-site-v1/scripts/verify-public-content.mjs "$base/"
          ! curl --fail --silent --retry 8 --retry-delay 4 "$base/" | grep -q "前端 Fixture"
          curl --fail --silent --retry 8 --retry-delay 4 "$base/admin/config.yml" | grep -q "repo: TaoismZp/xuyuan"
          for source in "/scripts/build.mjs" "/package.json" "/PROJECT_STATE.md" "/BACKEND_BUILD_BLUEPRINT.md"; do
            status=$(curl --silent --location --output /dev/null --write-out '%{http_code}' "$base$source")
            test "$status" = "404" || { echo "Source unexpectedly public on Pages: $source ($status)"; exit 1; }
          done
      - name: Install WebKit and CJK font
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.56.1
          npx playwright install --with-deps webkit
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Same-surface iPhone iPad desktop verification
        id: surface
        continue-on-error: true
        run: |
          mkdir -p personal-site-v1-public-evidence
          node <<'NODE'
          const { webkit } = require('playwright');
          const fs = require('node:fs');
          const base = 'https://taoismzp.github.io/xuyuan/personal-site-v1';
          const postsDir = 'personal-site-v1/content/posts';
          const publishedSlugs = fs.readdirSync(postsDir)
            .filter(file => file.endsWith('.md'))
            .filter(file => /^status:\s*"?published"?\s*$/m.test(fs.readFileSync(postsDir + '/' + file, 'utf8')))
            .map(file => {
              const frontmatter = fs.readFileSync(postsDir + '/' + file, 'utf8').split('---')[1] || '';
              const slug = frontmatter.match(/^slug:\s*["']?([^\s"']+)/m)?.[1] || file.slice(0, -3);
              return slug;
            });
          const assert = (value, message) => { if (!value) throw new Error(message); };
          (async () => {
            const browser = await webkit.launch({headless:true});
            const surfaces = [
              ['iphone',390,844,true],
              ['ipad',1024,1366,true],
              ['desktop',1440,1100,false]
            ];
            const pages = [
              ['home','/'],
              ['essays','/essays/'],
              ['projects','/projects/'],
              ['about','/about/'],
              ['write','/write/'],
              ...publishedSlugs.map(slug => ['article-'+slug,'/essays/'+encodeURIComponent(slug)+'/'])
            ];
            for (const [surface,w,h,mobile] of surfaces) {
              for (const [name,path] of pages) {
                const p = await browser.newPage({viewport:{width:w,height:h},isMobile:mobile,hasTouch:mobile,deviceScaleFactor:surface==='iphone'?2:1});
                await p.goto(base + path,{waitUntil:'networkidle'});
                const result = await p.evaluate(() => ({
                  overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
                  h1: document.querySelector('h1')?.textContent?.trim() || '',
                  tiny: [...document.querySelectorAll('nav a,button')].filter(el => {const r=el.getBoundingClientRect();return r.width>0&&(r.width<44||r.height<44)}).length,
                  skip: !!document.querySelector('.skip-link'),
                  hero: document.querySelector('.hero-title') ? parseFloat(getComputedStyle(document.querySelector('.hero-title')).fontSize) : null,
                  article: document.querySelector('.article-body') ? {
                    paragraphs: document.querySelectorAll('.article-body p').length,
                    characters: document.querySelector('.article-body').textContent.length,
                    fontSize: parseFloat(getComputedStyle(document.querySelector('.article-body')).fontSize),
                    lastParagraph: document.querySelector('.article-body p:last-of-type')?.textContent.trim() || ''
                  } : null
                }));
                assert(!result.overflow,`${surface}/${name}: horizontal overflow`);
                assert(result.h1.length>0,`${surface}/${name}: missing h1`);
                assert(result.tiny===0,`${surface}/${name}: target below 44px`);
                assert(result.skip,`${surface}/${name}: missing skip link`);
                if(name==='home') {
                  assert(result.hero >= (surface==='desktop'?100:50),`${surface}/home: hero hierarchy regressed`);
                  if(publishedSlugs.length) {
                    const featured=p.locator('.feature-essay');
                    assert(await featured.count()===1,`${surface}/home: expected one featured real essay`);
                    const href=await featured.getAttribute('href');
                    const slug=decodeURIComponent(href.replace(/^essays\//,'').replace(/\/$/,''));
                    assert(publishedSlugs.includes(slug),`${surface}/home: feature points to unpublished slug`);
                    assert((await featured.locator('.feature-essay__detail p').innerText()).length>=20,`${surface}/home: missing real summary`);
                    assert(await p.locator('.essay-line[href="'+href+'"]').count()===0,`${surface}/home: featured entry duplicated`);
                    assert(await p.locator('.essay-index__all[href="essays/"]').count()===1,`${surface}/home: archive navigation missing`);
                    const rect=await featured.boundingBox();
                    assert(rect && rect.width<=w,`${surface}/home: feature overflows viewport`);
                  } else {
                    assert(await p.locator('.feature-essay').count()===0,`${surface}/home: fake feature on empty site`);
                  }
                }
                if(name==='write'){
                  assert(await p.locator('#writing-form').count()===1,`${surface}/write: local writing form missing`);
                  const heroLines=await p.locator('.write-intro h1').evaluate(el=>el.getBoundingClientRect().height/parseFloat(getComputedStyle(el).lineHeight));
                  assert(heroLines>1.8&&heroLines<2.2,`${surface}/write: unexpected hero wrapping ${heroLines.toFixed(2)} lines`);

                  assert(await p.evaluate(()=>typeof window.markdownit)==='function',`${surface}/write: same Markdown parser missing`);
                  assert(!await p.evaluate(()=>Object.keys(localStorage).some(key=>key.includes('draft'))),`${surface}/write: unexpected local draft persistence`);
                  await p.locator('#write-title').fill('一篇本地写作演练');
                  await p.locator('#write-summary').fill('只是浏览器里的长文准备，不能自动提交 GitHub。');
                  await p.locator('#write-date').fill('2026-11-04');
                  await p.locator('#write-body').fill('第一段。\n\n## 第二层\n\n第二段。');
                  await p.locator('#write-preview-button').click();
                  assert((await p.locator('.write-preview-body h2').count())===1,`${surface}/write: preview headings missing`);
                  const url=await p.locator('#write-github').getAttribute('href');
                  assert(url.startsWith('https://github.com/TaoismZp/xuyuan/new/main/personal-site-v1/content/posts?filename='),`${surface}/write: native GitHub link missing`);
                  assert(!url.includes('value=') && !url.includes('第二层'),`${surface}/write: unpublished body leaked to URL`);
                  assert(!(await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)),`${surface}/write: overflow after editing`);
                  await p.screenshot({path:`personal-site-v1-public-evidence/${surface}-write-filled.png`,fullPage:false});
                }
                if(name.startsWith('article-')) {
                  assert(result.article && result.article.paragraphs >= 10,`${surface}/${name}: generated article body missing`);
                  assert(result.article.characters >= 1000,`${surface}/${name}: article content is unexpectedly short`);
                  assert(result.article.fontSize >= (surface==='iphone'?18:16),`${surface}/${name}: article typography too small`);
                  assert(result.article.lastParagraph.length > 0,`${surface}/${name}: article ending missing`);
                  await p.screenshot({path:`personal-site-v1-public-evidence/${surface}-${name}.png`,fullPage:false});
                  const headingCount = await p.locator('.article-body h2[id]').count();
                  assert(headingCount >= 1,`${surface}/${name}: article headings lack anchors`);
                  assert(await p.locator('.article-end a[href="../"]').count()===1,`${surface}/${name}: missing end-of-article archive link`);
                  if(surface==='iphone'){
                    const summary=p.locator('.article-outline-mobile summary');
                    assert(await summary.count()===1,`${surface}/${name}: section disclosure missing`);
                    const box=await summary.boundingBox();
                    assert(box && box.height >= 44,`${surface}/${name}: section disclosure touch target below 44px`);
                    await summary.click();
                    assert(await p.locator('.article-outline-mobile').evaluate(el=>el.open),`${surface}/${name}: section disclosure did not open`);
                    await p.locator('.article-outline-mobile [data-outline-link]').first().click();
                    assert(p.url().includes('#section-01'),`${surface}/${name}: section jump failed`);
                    assert(!(await p.locator('.article-outline-mobile').evaluate(el=>el.open)),`${surface}/${name}: section menu did not close`);
                  } else {
                    assert(await p.locator('.article-outline-desktop [data-outline-link]').count()===headingCount,`${surface}/${name}: desktop outline count mismatch`);
                    await p.locator('.article-outline-desktop [data-outline-link]').first().click();
                    assert(p.url().includes('#section-01'),`${surface}/${name}: desktop section jump failed`);
                  }
                  // Fragment navigation may still be animating in WebKit.
                  // Wait for the actual jump to settle before capturing the ending.
                  await p.waitForTimeout(1000);
                  await p.evaluate(() => {
                    document.documentElement.style.scrollBehavior = 'auto';
                    document.body.style.scrollBehavior = 'auto';
                    window.scrollTo(0, document.documentElement.scrollHeight);
                  });
                  await p.locator('.article-end').scrollIntoViewIfNeeded();
                  await p.waitForTimeout(350);
                  const bottom = await p.evaluate(() => {
                    const viewport = window.innerHeight;
                    const end = document.querySelector('.article-end').getBoundingClientRect();
                    const paragraphs = [...document.querySelectorAll('.article-body > p')];
                    const last = paragraphs.at(-1).getBoundingClientRect();
                    return {
                      y: window.scrollY,
                      maximum: Math.max(0, document.documentElement.scrollHeight - viewport),
                      endVisible: end.top < viewport && end.bottom > 0,
                      lastParagraphVisible: last.top < viewport && last.bottom > 0
                    };
                  });
                  assert(bottom.maximum > 1200 && bottom.y >= bottom.maximum - 16, `${surface}/${name}: failed to reach actual scroll bottom`);
                  assert(bottom.endVisible && bottom.lastParagraphVisible, `${surface}/${name}: final paragraph or end-of-article navigation not in viewport`);
                  await p.screenshot({path:`personal-site-v1-public-evidence/${surface}-${name}-end.png`,fullPage:false});
                } else {
                  await p.screenshot({path:`personal-site-v1-public-evidence/${surface}-${name}.png`,fullPage:true});
                }
                await p.close();
              }
            }


            // Perceptual regression: our user-authored CJK heading uses exactly one <br>.
            // Previous tests saw zero overflow yet allowed absurd isolated Han glyphs.
            for (const width of [320,375,390,430]) {
              for (const [name,path] of [['about','/about/'],['projects','/projects/'],['essays','/essays/']]) {
                const page=await browser.newPage({viewport:{width,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
                await page.goto(base + path,{waitUntil:'networkidle'});
                const metric=await page.locator('.page-head h1').evaluate(el=>{
                  const style=getComputedStyle(el);
                  const lineHeight=parseFloat(style.lineHeight);
                  return {
                    lineRatio:el.getBoundingClientRect().height/lineHeight,
                    explicitBreaks:el.querySelectorAll('br').length,
                    overwide:el.scrollWidth>el.clientWidth,
                    pageOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth
                  };
                });
                assert(metric.explicitBreaks===1,`${width}/${name}: unexpected heading content`);
                assert(metric.lineRatio>1.85&&metric.lineRatio<2.2,`${width}/${name}: CJK title broken into ${metric.lineRatio.toFixed(1)} lines; expected two authored lines`);
                assert(!metric.overwide&&!metric.pageOverflow,`${width}/${name}: heading or page horizontal overflow`);
                const navLines=await page.locator('.site-nav a').evaluateAll(els=>els.map(el=>{
                  const range=document.createRange();range.selectNodeContents(el);
                  return [...range.getClientRects()].filter(r=>r.width>0&&r.height>0).length;
                }));
                assert(navLines.length===4&&navLines.every(n=>n===1),`${width}/${name}: nav labels split into isolated CJK glyph lines`);
                await page.screenshot({path:`personal-site-v1-public-evidence/width-${width}-${name}.png`,fullPage:true});
                await page.close();
              }
            }

            const admin=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            await admin.goto(base+'/admin/',{waitUntil:'domcontentloaded'});
            await admin.waitForTimeout(7000);
            assert(!(await admin.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)),'iphone/admin: horizontal overflow');
            assert(await admin.getByRole('button',{name:/Sign In Using Access Token/i}).count()===1,'iphone/admin: token sign-in missing');
            await admin.screenshot({path:'personal-site-v1-public-evidence/iphone-admin.png',fullPage:true});
            await admin.close();
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Generate bound Acceptance Report
        if: always()
        env:
          HTTP_OUTCOME: ${{ steps.http.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
        run: |
          if [ "$HTTP_OUTCOME" = success ] && [ "$SURFACE_OUTCOME" = success ]; then RESULT=PASS; else RESULT=FAIL; fi
          VISION=$(sha256sum personal-site-v1/VISION_FIXTURE_V2.md | cut -d' ' -f1)
          BLUEPRINT=$(sha256sum personal-site-v1/BUILD_BLUEPRINT_V2.md | cut -d' ' -f1)
          BACKEND_BLUEPRINT=$(sha256sum personal-site-v1/BACKEND_BUILD_BLUEPRINT.md | cut -d' ' -f1)
          PUBLISHED_COUNT=$(node -e 'const fs=require("node:fs");const d="personal-site-v1/content/posts";console.log(fs.readdirSync(d).filter(f=>f.endsWith(".md")).filter(f=>fs.readFileSync(d+"/"+f,"utf8").split("\n").some(l=>l.trim()==="status: published")).length)')
          {
            echo '# Acceptance Report — Personal Site v1'
            echo
            echo "- Result: **${RESULT}**"
            echo "- Candidate Identity: ${GITHUB_SHA}"
            echo "- Delivery Identity: ${{ github.event.workflow_run.head_sha }}"
            echo "- Accepted Vision Fixture V2 Identity (sha256): ${VISION}"
            echo "- Accepted Frontend Blueprint V2 Identity (sha256): ${BLUEPRINT}"
            echo "- Backend Blueprint Identity (sha256): ${BACKEND_BLUEPRINT}"
            echo "- Evidence Identity: GitHub Actions run ${GITHUB_RUN_ID}"
            echo '- Delivery Surface: https://taoismzp.github.io/xuyuan/personal-site-v1/'
            echo
            echo '## Gates'
            echo "- Public HTTP / Delivery Reality: ${HTTP_OUTCOME}"
            echo "- iPhone + iPad + desktop WebKit / Experience Reality: ${SURFACE_OUTCOME}"
            echo '- Functional article-generation loop: verified pre-promotion by backend integration CI on this candidate lineage using ephemeral published + draft fixtures.'
            echo "- Public article surface: ${PUBLISHED_COUNT} source-of-truth published Markdown post(s), verified against public HTTP; available article pages opened and captured with iPhone/iPad/desktop WebKit."
            echo '- CMS login entrance: verified as an unauthenticated public UI only.'
            echo '- Owner-authenticated edit/save/publication: **PENDING_OWNER** (never performed by this workflow).'
            echo '- Token-free composer: on-device Markdown preview/download/copy and filename-only GitHub handoff verified; no authenticated GitHub Commit was performed.'
            echo '- Acceptance scope: **PUBLIC_READER_SURFACE_AND_LOCAL_COMPOSER_ONLY**. This PASS is not FULL_PERSONAL_PUBLISHING_LOOP.'
            echo
            if [ "$RESULT" = PASS ]; then
              echo "PASS: the PUBLIC READER SURFACE matches this delivery identity (${PUBLISHED_COUNT} real article(s)); owner CMS authoring remains PENDING_OWNER."
            else
              echo 'FAIL: delivery or same-surface experience did not pass; do not claim final handoff.'
            fi
          } > ACCEPTANCE_REPORT.md
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: personal-site-v1-acceptance-${{ github.run_id }}
          path: |
            ACCEPTANCE_REPORT.md
            personal-site-v1-public-evidence/*.png
          if-no-files-found: warn
          retention-days: 90
      - name: Acceptance gate
        if: always()
        env:
          HTTP_OUTCOME: ${{ steps.http.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
        run: |
          test "$HTTP_OUTCOME" = success
          test "$SURFACE_OUTCOME" = success
