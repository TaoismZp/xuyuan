name: Deploy playable artifacts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'crypto-tycoon/**'
      - 'essays/**'
      - 'longform-v2/**'
      - 'personal-site-v1/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build personal site from canonical content
        run: |
          npm install --prefix personal-site-v1 --no-audit --no-fund
          ALLOW_EMPTY_BUILD=1 node personal-site-v1/scripts/build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
