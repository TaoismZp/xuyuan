name: Deploy playable artifacts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'crypto-tycoon/**'
      - 'essays/**'
      - 'longform-v2/**'
      # Only production inputs trigger a site deployment.
      # PROJECT_STATE.md, reports, vision notes and release bookkeeping do not.
      - 'personal-site-v1/content/posts/**'
      - 'personal-site-v1/assets/**'
      - 'personal-site-v1/admin/**'
      - 'personal-site-v1/write/**'
      - 'personal-site-v1/scripts/**'
      - 'personal-site-v1/media/**'
      - 'personal-site-v1/about/**'
      - 'personal-site-v1/projects/**'
      - 'personal-site-v1/essays/**'
      - 'personal-site-v1/index.html'
      - 'personal-site-v1/package*.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build personal site from canonical content
        run: |
          npm install --prefix personal-site-v1 --no-audit --no-fund
          ALLOW_EMPTY_BUILD=1 node personal-site-v1/scripts/build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble only public files
        run: node personal-site-v1/scripts/assemble-pages.mjs "$RUNNER_TEMP/pages-publish"
      - name: Verify public artifact isolation
        run: node personal-site-v1/scripts/verify-pages-artifact.mjs "$RUNNER_TEMP/pages-publish"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-publish
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
