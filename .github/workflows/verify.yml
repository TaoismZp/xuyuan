name: Verify FIN TYPE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify 16-type reachability
        run: node tests/types.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/fintype-http.log 2>&1 &
          sleep 2
      - name: Run browser + semantic regression
        run: node tests/e2e.js
