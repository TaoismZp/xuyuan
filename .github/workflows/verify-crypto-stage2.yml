name: Verify Crypto Tycoon Stage 2

on:
  push:
    branches: [main]
    paths:
      - 'wish-delivery/versions/v7.6.md'
      - 'crypto-tycoon/BUILD_BLUEPRINT_V5.md'
      - 'crypto-tycoon/candidate-v9.html'
      - 'crypto-tycoon/candidate-v9-augment.js'
      - 'crypto-tycoon/candidate-v10.css'
      - 'crypto-tycoon/candidate-v10.html'
      - 'crypto-tycoon/candidate-v10-interaction.js'
      - 'tests/crypto-stage2-e2e.js'
      - '.github/workflows/verify-crypto-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify protocol and controlling drawing identity
        run: |
          test -f wish-delivery/versions/v7.6.md
          test -f crypto-tycoon/BUILD_BLUEPRINT_V5.md
          test -f crypto-tycoon/SUPERVISION_REPORT_V9.md
          grep -q 'wish-delivery/versions/v7.6.md' crypto-tycoon/BUILD_BLUEPRINT_V5.md
          echo "PROTOCOL_SHA=$(git hash-object wish-delivery/versions/v7.6.md)"
          echo "BLUEPRINT_SHA=$(git hash-object crypto-tycoon/BUILD_BLUEPRINT_V5.md)"
          echo "STAGE1_REPORT_SHA=$(git hash-object crypto-tycoon/SUPERVISION_REPORT_V9.md)"
          echo "CANDIDATE_COMMIT=$GITHUB_SHA"
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          fc-cache -f
      - name: Install Playwright client
        run: |
          npm init -y
          npm install --save-dev playwright
      - name: Start candidate server
        run: |
          python3 -m http.server 8080 >/tmp/crypto-stage2-http.log 2>&1 &
          echo $! > /tmp/crypto-stage2-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8080/crypto-tycoon/candidate-v10.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/crypto-stage2-http.log
          exit 1
      - name: Execute real Stage-2 interaction loop
        env:
          TARGET_URL: http://127.0.0.1:8080/crypto-tycoon/candidate-v10.html?test=1
          EXPECTED_VERSION: candidate-v10
          PW_CHANNEL: chrome
        run: node tests/crypto-stage2-e2e.js
      - name: Upload Stage-2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-stage2-acceptance-v10
          path: artifacts/*
          if-no-files-found: warn
