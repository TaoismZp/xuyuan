name: Build personal site content

on:
  push:
    branches: [main]
    paths:
      - '.pages.yml'
      - 'personal-site-v1/content/**'
      - 'personal-site-v1/scripts/build_content.py'
      - 'personal-site-v1/templates/article.html'
      - 'personal-site-v1/requirements-content.txt'
      - '.github/workflows/build-personal-site-content.yml'

permissions:
  contents: write

concurrency:
  group: personal-site-content-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: personal-site-v1/requirements-content.txt
      - name: Install pinned content compiler
        run: pip install -r personal-site-v1/requirements-content.txt
      - name: Compile published content
        run: python3 personal-site-v1/scripts/build_content.py
      - name: Guard draft exclusion
        run: |
          ! grep -R "后台验收样稿" personal-site-v1/index.html personal-site-v1/essays/index.html personal-site-v1/feed.xml personal-site-v1/sitemap.xml
          test ! -d personal-site-v1/essays/backend-verification-draft
      - name: Commit generated public artifacts
        run: |
          git config user.name "personal-site-content[bot]"
          git config user.email "personal-site-content[bot]@users.noreply.github.com"
          git add -A personal-site-v1/index.html personal-site-v1/essays personal-site-v1/feed.xml personal-site-v1/sitemap.xml personal-site-v1/content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Build personal site published content"
            git push origin main
          fi
