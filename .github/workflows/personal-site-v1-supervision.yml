name: Independent supervision — personal site v1
on:
  push:
    branches: [personal-site-v1-frontend]
    paths:
      - 'personal-site-v1/**'
      - '.github/workflows/personal-site-v1-supervision.yml'
      - '.github/workflows/personal-site-v1-backend-build.yml'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install only build dependencies
        run: npm install --prefix personal-site-v1 --no-audit --no-fund
      - name: Independent construction and blueprint inspection
        id: inspect
        run: |
          set -euo pipefail
          test -f personal-site-v1/VISION_FIXTURE.md
          test -f personal-site-v1/BUILD_BLUEPRINT.md
          test -f personal-site-v1/BACKEND_CAPABILITY_PROOF.md
          test -f personal-site-v1/BACKEND_BUILD_BLUEPRINT.md
          test -f personal-site-v1/admin/index.html
          test -f personal-site-v1/admin/config.yml
          test -f personal-site-v1/scripts/build.mjs

          grep -q '@sveltia/cms@0.258.0' personal-site-v1/admin/index.html
          grep -q 'name: github' personal-site-v1/admin/config.yml
          grep -q 'repo: TaoismZp/xuyuan' personal-site-v1/admin/config.yml
          grep -q 'branch: main' personal-site-v1/admin/config.yml
          grep -q 'root_dir: personal-site-v1' personal-site-v1/admin/config.yml
          grep -q 'auth_methods: \[token\]' personal-site-v1/admin/config.yml
          ! grep -R -E 'github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+' personal-site-v1 .github/workflows/personal-site-v1-*.yml

          node <<'NODE'
          const p=require('./personal-site-v1/package.json');
          const deps=Object.keys(p.dependencies||{}).sort();
          const expected=['gray-matter','markdown-it'];
          if(JSON.stringify(deps)!==JSON.stringify(expected)) throw new Error(`unexpected runtime dependencies: ${deps}`);
          NODE

          mkdir -p personal-site-v1/content/posts
          cat > personal-site-v1/content/posts/supervision-published.md <<'POST'
          ---
          title: "监理样稿：等待"
          summary: "只存在于独立监理运行中的文章。"
          date: "2026-11-03"
          tags: ["交易", "纪律"]
          status: published
          ---

          第一段。

          ## 第二层发现

          第二段。
          POST
          node personal-site-v1/scripts/build.mjs

          grep -q 'class="hero-title"' personal-site-v1/index.html
          grep -q 'class="hero-line"' personal-site-v1/index.html
          grep -q 'class="section-heading"' personal-site-v1/index.html
          grep -q 'class="essay-index"' personal-site-v1/index.html
          grep -q 'class="essay-line"' personal-site-v1/index.html
          grep -q 'class="project-minimal"' personal-site-v1/index.html
          ! grep -q 'minimal-hero\|essay-row\|minimal-projects\|section-kicker' personal-site-v1/index.html

          grep -q 'class="page-head__eyebrow">ESSAYS' personal-site-v1/essays/index.html
          grep -q 'class="archive-row"' personal-site-v1/essays/index.html
          grep -q 'class="article-head"' personal-site-v1/essays/supervision-published/index.html
          grep -q 'class="article-body"' personal-site-v1/essays/supervision-published/index.html
          grep -q '>首页<' personal-site-v1/index.html
          grep -q '>首页<' personal-site-v1/essays/index.html
          grep -q '>首页<' personal-site-v1/essays/supervision-published/index.html
          ! grep -R -E '前端 Fixture|阅读样稿|不冒充正式发布' personal-site-v1/index.html personal-site-v1/essays/index.html personal-site-v1/essays/supervision-published/index.html
          test ! -d personal-site-v1/essays/sample

          rm -f personal-site-v1/content/posts/supervision-published.md
          ALLOW_EMPTY_BUILD=1 node personal-site-v1/scripts/build.mjs
          grep -q '还没有公开长文' personal-site-v1/essays/index.html
          ! grep -R '监理样稿：等待' personal-site-v1/index.html personal-site-v1/essays/index.html
          test ! -d personal-site-v1/essays/sample
      - name: Generate bound supervision report
        if: always()
        run: |
          if [ "${{ steps.inspect.outcome }}" = "success" ]; then RESULT=PASS; else RESULT=FAIL; fi
          VISION=$(sha256sum personal-site-v1/VISION_FIXTURE.md | cut -d' ' -f1)
          BLUEPRINT=$(sha256sum personal-site-v1/BACKEND_BUILD_BLUEPRINT.md | cut -d' ' -f1)
          cat > SUPERVISION_REPORT.md <<EOF
          # Independent Supervision Report — Personal Site v1

          - Result: **${RESULT}**
          - Candidate Identity: `${GITHUB_SHA}`
          - Vision Fixture Identity (sha256): `${VISION}`
          - Backend Blueprint Identity (sha256): `${BLUEPRINT}`
          - Evidence Identity: GitHub Actions run `${GITHUB_RUN_ID}`
          - Inspector surface: read-only source + clean-room generated output

          ## Inspected

          - Four-pack prerequisites present before handoff.
          - Sveltia production admin is pinned and bound to GitHub/main/personal-site-v1.
          - Token login is configured without any committed credential.
          - Runtime dependency set remains deliberately minimal.
          - Published content maps into the exact accepted frontend class vocabulary.
          - Deprecated/wrong generator class vocabulary is absent.
          - Generated archive/article navigation remains intact.
          - Frontend fixture/sample language does not leak after a real build.
          - Empty production builds remove the sample article and render a truthful empty archive.
          - Draft/public filtering remains the responsibility of the builder and is separately exercised by backend integration CI.

          ## Stop-work decision

          ${RESULT}: ${RESULT:+candidate may proceed only if the separate browser/experience evidence for this same commit also passes.}
          EOF
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: personal-site-v1-supervision-${{ github.run_id }}
          path: SUPERVISION_REPORT.md
          retention-days: 90
