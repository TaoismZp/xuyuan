name: Independent supervision — personal site v1
on:
  push:
    branches: [personal-site-v1-frontend, personal-site-v1-public-hardening, personal-site-v1-distribution-metadata]
    paths:
      - 'personal-site-v1/**'
      - '.github/workflows/personal-site-v1-supervision.yml'
      - '.github/workflows/personal-site-v1-backend-build.yml'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install only build dependencies
        run: npm install --prefix personal-site-v1 --no-audit --no-fund
      - name: Independent construction and blueprint inspection
        id: inspect
        run: |
          set -euo pipefail
          check() { echo "[CHECK] $1"; shift; "$@"; echo "[PASS] $1" >/dev/null 2>&1 || true; }
          require_text() { local label="$1" file="$2" pattern="$3"; echo "[CHECK] $label"; grep -q -- "$pattern" "$file" || { echo "[FAIL] $label"; exit 1; }; echo "[PASS] $label"; }
          forbid_text() { local label="$1" file="$2" pattern="$3"; echo "[CHECK] $label"; if grep -q -E -- "$pattern" "$file"; then echo "[FAIL] $label"; exit 1; fi; echo "[PASS] $label"; }
          require_file() { local label="$1" file="$2"; echo "[CHECK] $label"; test -f "$file" || { echo "[FAIL] $label"; exit 1; }; echo "[PASS] $label"; }
          forbid_dir() { local label="$1" dir="$2"; echo "[CHECK] $label"; test ! -d "$dir" || { echo "[FAIL] $label"; exit 1; }; echo "[PASS] $label"; }

          require_file 'Vision fixture exists' personal-site-v1/VISION_FIXTURE.md
          require_file 'Frontend blueprint exists' personal-site-v1/BUILD_BLUEPRINT.md
          require_file 'Backend capability proof exists' personal-site-v1/BACKEND_CAPABILITY_PROOF.md
          require_file 'Backend build blueprint exists' personal-site-v1/BACKEND_BUILD_BLUEPRINT.md
          require_file 'Production admin entry exists' personal-site-v1/admin/index.html
          require_file 'Production admin config exists' personal-site-v1/admin/config.yml
          require_file 'Deterministic builder exists' personal-site-v1/scripts/build.mjs

          require_text 'Sveltia version is pinned' personal-site-v1/admin/index.html '@sveltia/cms@0.258.0'
          require_text 'GitHub backend selected' personal-site-v1/admin/config.yml 'name: github'
          require_text 'Repository bound' personal-site-v1/admin/config.yml 'repo: TaoismZp/xuyuan'
          require_text 'Production branch bound' personal-site-v1/admin/config.yml 'branch: main'
          require_text 'Monorepo root bound' personal-site-v1/admin/config.yml 'root_dir: personal-site-v1'
          require_text 'Token-only auth declared' personal-site-v1/admin/config.yml 'auth_methods: \[token\]'

          echo '[CHECK] No committed GitHub credential patterns'
          if grep -R -E 'github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+' personal-site-v1 .github/workflows/personal-site-v1-*.yml; then
            echo '[FAIL] Credential-like token pattern found'; exit 1
          fi
          echo '[PASS] No committed GitHub credential patterns'

          echo '[CHECK] Runtime dependency set is minimal'
          node <<'NODE'
          const p=require('./personal-site-v1/package.json');
          const deps=Object.keys(p.dependencies||{}).sort();
          const expected=['gray-matter','markdown-it'];
          if(JSON.stringify(deps)!==JSON.stringify(expected)) throw new Error(`unexpected runtime dependencies: ${deps}`);
          console.log('[PASS] Runtime dependency set is minimal');
          NODE

          mkdir -p personal-site-v1/content/posts
          cat > personal-site-v1/content/posts/supervision-published.md <<'POST'
          ---
          title: "监理样稿：等待"
          summary: "只存在于独立监理运行中的文章。"
          date: "2026-11-03"
          tags: ["交易", "纪律"]
          status: published
          ---

          第一段。

          ## 第二层发现

          第二段。
          POST

          echo '[CHECK] Build one supervision-only published article'
          node personal-site-v1/scripts/build.mjs
          echo '[PASS] Build one supervision-only published article'
          echo '[CHECK] Deployment artifact does not ship source content'
          node personal-site-v1/scripts/assemble-pages.mjs "$RUNNER_TEMP/pages-publish"
          node personal-site-v1/scripts/verify-pages-artifact.mjs "$RUNNER_TEMP/pages-publish"
          test -f "$RUNNER_TEMP/pages-publish/personal-site-v1/essays/supervision-published/index.html"
          test ! -e "$RUNNER_TEMP/pages-publish/personal-site-v1/content"
          grep -q 'supervision-published' "$RUNNER_TEMP/pages-publish/personal-site-v1/sitemap.xml"
          grep -q '监理样稿：等待' "$RUNNER_TEMP/pages-publish/personal-site-v1/feed.xml"
          echo '[PASS] Public artifact excludes raw manuscripts and builder'

          require_text 'Accepted hero class preserved' personal-site-v1/index.html 'class="hero-title"'
          require_text 'Accepted hero line preserved' personal-site-v1/index.html 'class="hero-line"'
          require_text 'Accepted section heading preserved' personal-site-v1/index.html 'class="section-heading"'
          require_text 'Accepted essay index preserved' personal-site-v1/index.html 'class="essay-index"'
          require_text 'Accepted essay line preserved' personal-site-v1/index.html 'class="essay-line"'
          require_text 'Accepted project layout preserved' personal-site-v1/index.html 'class="project-minimal"'
          forbid_text 'Deprecated generator classes absent' personal-site-v1/index.html 'minimal-hero|essay-row|minimal-projects|section-kicker'

          require_text 'Archive eyebrow preserved' personal-site-v1/essays/index.html 'class="page-head__eyebrow">ESSAYS'
          require_text 'Archive row preserved' personal-site-v1/essays/index.html 'class="archive-row"'
          require_text 'Article head generated' personal-site-v1/essays/supervision-published/index.html 'article-head'
          require_text 'Article body generated' personal-site-v1/essays/supervision-published/index.html 'article-body'
          require_text 'Home navigation present on homepage' personal-site-v1/index.html '>首页<'
          require_text 'Home navigation present on archive' personal-site-v1/essays/index.html '>首页<'
          require_text 'Home navigation present on article' personal-site-v1/essays/supervision-published/index.html '>首页<'

          echo '[CHECK] No frontend fixture/sample wording leaks after build'
          if grep -R -E '前端 Fixture|阅读样稿|不冒充正式发布' personal-site-v1/index.html personal-site-v1/essays/index.html personal-site-v1/essays/supervision-published/index.html; then
            echo '[FAIL] Fixture/sample wording leaked'; exit 1
          fi
          echo '[PASS] No frontend fixture/sample wording leaks after build'
          forbid_dir 'Old sample article removed after real build' personal-site-v1/essays/sample

          rm -f personal-site-v1/content/posts/supervision-published.md
          echo '[CHECK] Empty production build is truthful'
          ALLOW_EMPTY_BUILD=1 node personal-site-v1/scripts/build.mjs
          require_text 'Empty archive says no public essays' personal-site-v1/essays/index.html '还没有公开长文'
          echo '[CHECK] Supervision fixture removed from public output'
          if grep -R '监理样稿：等待' personal-site-v1/index.html personal-site-v1/essays/index.html; then
            echo '[FAIL] Supervision fixture remained after empty build'; exit 1
          fi
          echo '[PASS] Supervision fixture removed from public output'
          forbid_dir 'Old sample article absent after empty build' personal-site-v1/essays/sample
      - name: Generate bound supervision report
        if: always()
        env:
          INSPECTION_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          if [ "$INSPECTION_OUTCOME" = "success" ]; then RESULT=PASS; else RESULT=FAIL; fi
          VISION=$(sha256sum personal-site-v1/VISION_FIXTURE.md | cut -d' ' -f1)
          BLUEPRINT=$(sha256sum personal-site-v1/BACKEND_BUILD_BLUEPRINT.md | cut -d' ' -f1)
          {
            echo '# Independent Supervision Report — Personal Site v1'
            echo
            echo "- Result: **${RESULT}**"
            echo "- Candidate Identity: ${GITHUB_SHA}"
            echo "- Vision Fixture Identity (sha256): ${VISION}"
            echo "- Backend Blueprint Identity (sha256): ${BLUEPRINT}"
            echo "- Evidence Identity: GitHub Actions run ${GITHUB_RUN_ID}"
            echo '- Inspector surface: read-only source + clean-room generated output'
            echo
            echo '## Inspected'
            echo
            echo '- Four-pack prerequisites present before handoff.'
            echo '- Sveltia production admin is pinned and bound to GitHub/main/personal-site-v1.'
            echo '- Token login is configured without any committed credential.'
            echo '- Runtime dependency set remains deliberately minimal.'
            echo '- Published content maps into the accepted frontend class vocabulary.'
            echo '- Deprecated/wrong generator class vocabulary is absent.'
            echo '- Generated archive/article navigation remains intact.'
            echo '- Frontend fixture/sample language does not leak after a real build.'
            echo '- Empty production builds remove the sample article and render a truthful empty archive.'
            echo '- Draft/public filtering is separately exercised by backend integration CI.'
            echo
            echo '## Stop-work decision'
            echo
            if [ "$RESULT" = 'PASS' ]; then
              echo 'PASS: candidate may proceed only if separate browser/experience evidence for this same commit also passes.'
            else
              echo 'FAIL: stop work and repair before acceptance or deployment.'
            fi
          } > SUPERVISION_REPORT.md
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: personal-site-v1-supervision-${{ github.run_id }}
          path: SUPERVISION_REPORT.md
          retention-days: 90
